# Secretless bootstrap loaded from a GitHub head commit. It pins the synthetic
# merge once; the validated merge commit then uploads shadow-steps.yml so every
# executed definition and workload comes from the exact tree being measured.

env:
  TRON_CI_PROVIDER: "buildkite"
  TRON_CI_ADVISORY_ONLY: "true"

steps:
  - label: ":pushpin: Pin advisory source context"
    key: "source-context"
    if: '(build.branch == "main" && build.pull_request.id == null) || (build.pull_request.id != null && build.pull_request.base_branch == "main" && build.pull_request.draft == false)'
    command: "scripts/ci-shadow-run.sh source-context"
    timeout_in_minutes: 10
    retry:
      manual:
        allowed: false
        reason: "Source context must be repinned by a new build"
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/source-context/**/*"
