# Dynamically uploaded only after source-context checks out and bundles the
# exact synthetic merge (or exact main commit). Every step is advisory.

env:
  TRON_CI_PROVIDER: "buildkite"
  TRON_CI_ADVISORY_ONLY: "true"

steps:
  - label: ":information_source: Shadow status"
    key: "shadow-notice"
    command: "scripts/ci-shadow-run.sh notice"
    depends_on: "source-context"
    timeout_in_minutes: 5
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/notice/**/*"
    retry: &infrastructure_retry
      automatic:
        - exit_status: -1
          limit: 2

  - label: ":shield: Personal-info guard (shadow)"
    key: "personal-info-guard"
    command: "scripts/ci-shadow-run.sh personal-info-guard"
    depends_on: "source-context"
    timeout_in_minutes: 8
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/personal-info-guard/**/*"
    retry: *infrastructure_retry

  - label: ":straight_ruler: Version drift (shadow)"
    key: "version-drift"
    command: "scripts/ci-shadow-run.sh version-drift"
    depends_on: "source-context"
    timeout_in_minutes: 8
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/version-drift/**/*"
    retry: *infrastructure_retry

  - label: ":lint-roller: Workflow lint (shadow)"
    key: "workflow-lint"
    command: "scripts/ci-shadow-run.sh workflow-lint"
    depends_on: "source-context"
    timeout_in_minutes: 5
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/workflow-lint/**/*"
    retry: *infrastructure_retry

  - label: ":rust: Rust quality (shadow)"
    key: "rust"
    command: "scripts/ci-shadow-run.sh rust"
    depends_on: "source-context"
    timeout_in_minutes: 45
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/rust/**/*"
    retry: *infrastructure_retry

  - label: ":ios: iOS measured build + test (shadow)"
    key: "ios"
    command: "scripts/ci-shadow-run.sh ios"
    depends_on: "source-context"
    timeout_in_minutes: 25
    agents:
      queue: "macos-medium"
    artifact_paths:
      - "build/ci-shadow/ios/**/*"
      - "packages/ios-app/build/ios-ci-metrics.json"
    retry: *infrastructure_retry

  - label: ":mac: Mac wrapper build + test (shadow)"
    key: "mac"
    command: "scripts/ci-shadow-run.sh mac"
    depends_on: "source-context"
    timeout_in_minutes: 45
    agents:
      queue: "macos-medium"
    artifact_paths:
      - "build/ci-shadow/mac/**/*"
      - "packages/mac-app/dist/Tron-dryrun.dmg"
    retry: *infrastructure_retry

  - label: ":mag_right: Advisory validation evidence"
    key: "shadow-evidence"
    if: 'build.pull_request.id != null && build.pull_request.draft == false'
    command: "scripts/ci-shadow-run.sh evidence"
    depends_on:
      - "personal-info-guard"
      - "version-drift"
      - "workflow-lint"
      - "rust"
      - "ios"
      - "mac"
    timeout_in_minutes: 8
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/evidence/**/*"
    retry: *infrastructure_retry

  - label: ":bar_chart: Advisory operational observation"
    key: "operational-observation"
    command: "scripts/ci-shadow-run.sh operational-observation"
    depends_on:
      - "personal-info-guard"
      - "version-drift"
      - "workflow-lint"
      - "rust"
      - "ios"
      - "mac"
    allow_dependency_failure: true
    soft_fail: true
    timeout_in_minutes: 8
    agents:
      queue: "linux-medium"
    artifact_paths:
      - "build/ci-shadow/operational-observation/**/*"
    retry: *infrastructure_retry
