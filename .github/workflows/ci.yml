name: CI
# A fast, deterministic regression signal for main and pull requests (#1026). Landing
# does not wait for it: `scripts/tron work land` verifies every change locally, and E2E
# journeys, the nested SDK pass and the iOS/Mac builds run only there.
#
# Every step below is one `scripts/tron ci <step>`, so a red step is reproduced by the
# same command on a checkout. Nothing here retries, quarantines or skips: a check that
# cannot pass reliably on a hosted runner does not belong here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same pull request replaces its run; main runs always finish.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/push-relay/package-lock.json
      - run: scripts/tron ci repo.policy
      - run: scripts/tron ci relay.check

  gateway:
    # macOS: the Gateway's integration tests exercise this platform's process, PTY and
    # filesystem behaviour, which is what ships.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json
      - run: scripts/tron ci gateway.build
      - run: scripts/tron ci gateway.integration
