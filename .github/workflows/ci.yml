# Continuous Integration
#
# Six validation workloads, plus change detection and one aggregate gate:
#   - personal-info-guard: ubuntu, ~30s, runs every PR + push (always).
#   - version-drift:       ubuntu, ~10s, validates VERSION.env mirrors.
#   - workflow-lint:       ubuntu, validates every Actions workflow.
#   - rust:                ubuntu (1x), runs the canonical `scripts/tron ci`
#                          checks for every repository change.
#   - ios:                 macos (10x), runs when packages/ios-app/** or its
#                          release workflow changes, or for every non-PR full
#                          validation.
#   - mac:                 macos (10x), runs when packages/mac-app/** or
#                          packages/agent/** changes (the Rust binary is
#                          embedded in the Mac app bundle), or for every
#                          non-PR full validation. Also exercises a
#                          dry-run DMG assembly on PR to catch release-mac.yml
#                          drift before tag push.
#
# Rust is intentionally unconditional because its invariant targets inspect
# Rust, docs, scripts, workflows, and client source, including immutable
# full-SHA/digest pins for every external workflow dependency. Only macOS
# workloads are path-gated on PRs. Pushes to main and manual dispatch run the
# full matrix.
#
# Concurrency: in-flight runs for the same PR are cancelled on new pushes
# (cheap on push to main — only one run can be in flight there anyway).
#
# Adding a new ecosystem:
#   1. Add a path rule in `scripts/ci-change-flags.sh`.
#   2. Add a `<name>_required` output combining non-PR, filter, and label rules;
#      gate the new job only on that output.
#   3. List the job under `ci.needs` and expose both its result and required
#      output to the aggregate script.
#   4. Document in CONTRIBUTING.md.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel previous in-flight runs for the same PR to avoid macOS minute waste.
# Pushes to main never cancel — full-history validation is the goal there.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ios_required: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' || contains(github.event.pull_request.labels.*.name, 'ios') }}
      mac_required: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mac == 'true' || contains(github.event.pull_request.labels.*.name, 'mac') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          TRON_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          TRON_DIFF_HEAD_SHA: ${{ github.sha }}
        run: scripts/ci-change-flags.sh

  personal-info-guard:
    name: Personal-info guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run personal-info-guard
        run: ./scripts/personal-info-guard.sh

  version-drift:
    name: Version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check centralized version mirrors
        run: ./scripts/tron version check
      - name: Run version helper tests
        run: ./scripts/tron version test
      - name: Run release notes helper tests
        run: ./scripts/tron-release-notes --test
      - name: Run deterministic CI helper tests
        run: |
          ./scripts/ci-change-flags.sh --self-test
          python3 scripts/benchmarks/bench.py --self-test
          python3 scripts/evaluation/whole-agent.py --self-test

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: packages/agent
          # `scripts/tron ci` owns the explicit warning policy.
          rustflags: ""

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Formatting
        run: scripts/tron ci fmt
      - name: Compile check
        run: scripts/tron ci check
      - name: Clippy
        run: scripts/tron ci clippy
      - name: Tests
        run: scripts/tron ci test

  ios:
    name: iOS (xcodebuild test)
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.ios_required == 'true'
    defaults:
      run:
        working-directory: packages/ios-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Install checksum-pinned tools
        run: ../../scripts/install-ci-tools.sh xcodegen

      - name: Verify pinned toolchain
        run: ../../scripts/verify-ci-toolchain.sh ios xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available iOS simulators
        run: xcrun simctl list devices available | head -60

      - name: xcodebuild test
        run: |
          set -o pipefail
          xcodebuild test \
            -project TronMobile.xcodeproj \
            -scheme 'Tron Beta' \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro' \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: packages/ios-app/TestResults.xcresult
          retention-days: 7

  mac:
    name: Mac wrapper (build + test, dry-run DMG)
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.mac_required == 'true'
    defaults:
      run:
        working-directory: packages/mac-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      # The Rust agent is embedded as a Resource in the Mac app bundle.
      # CI builds a debug-profile copy so `scripts/bundle-agent.sh`
      # succeeds, but we don't ship this binary — the release pipeline
      # (release-mac.yml) rebuilds it in `--release` with signing.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: packages/agent
          rustflags: "-D warnings"

      - name: Build agent helper (debug, for embedding)
        working-directory: packages/agent
        run: cargo build --bin tron --locked

      - name: Install checksum-pinned tools
        run: ../../scripts/install-ci-tools.sh xcodegen create-dmg

      - name: Verify pinned toolchain
        run: ../../scripts/verify-ci-toolchain.sh xcode xcodegen create-dmg

      - name: Stage agent helper binary
        run: ./scripts/bundle-agent.sh --skip-build --profile debug

      - name: Validate staged helper binary
        run: |
          test -x "Sources/Resources/Library/LoginItems/Tron Server.app/Contents/MacOS/tron"

      - name: Generate Xcode project
        run: xcodegen generate

      # Build the TronMac scheme in Debug and compile its unit-test bundle;
      # ad-hoc signing (CODE_SIGN_IDENTITY="-") keeps this portable to any
      # macOS runner without importing the Developer ID certificate.
      #
      # GitHub's hosted app-hosted macOS test runner can wedge before Swift
      # Testing starts. `build-for-testing` still catches Swift compile/link
      # drift in the app + tests without launching the UI process. Run the
      # app-hosted Mac tests locally from Xcode when changing wrapper logic.
      - name: xcodebuild build-for-testing
        timeout-minutes: 15
        env:
          TRON_MAC_TEST_HOST: "1"
        run: |
          set -o pipefail
          destination="platform=macOS,arch=$(uname -m)"
          xcodebuild build-for-testing \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -destination "$destination" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet

      - name: xcodebuild focused wrapper tests
        timeout-minutes: 20
        env:
          TRON_MAC_TEST_HOST: "1"
        run: |
          set -o pipefail
          destination="platform=macOS,arch=$(uname -m)"
          xcodebuild test \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -destination "$destination" \
            -configuration Debug \
            -only-testing:TronMacTests/TronPathsTests \
            -only-testing:TronMacTests/ServerStatusPollerTests \
            -only-testing:TronMacTests/TailscaleProbeTests \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet

      # Dry-run the package-owned DMG transaction on PRs without signing,
      # notarization, or publication. The release workflow retains release
      # orchestration; scripts/package-dmg.sh owns assembly and mount proof.
      - name: Dry-run DMG assembly
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p build
          # Xcode 26 adds an unsigned __preview.dylib to generic Debug builds;
          # packaging validation does not need previews and re-signs the app.
          xcodebuild \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -configuration Debug \
            -derivedDataPath build/dd \
            -destination 'generic/platform=macOS' \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet build
          APP_PATH="$(find build/dd -name 'TronMac.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::TronMac.app not produced by debug build"
            exit 1
          fi
          mkdir -p dist
          DMG_PATH="$(pwd)/dist/Tron-dryrun.dmg"
          ./scripts/package-dmg.sh \
            --app "$APP_PATH" \
            --output "$DMG_PATH" \
            --volume-name "Tron Dry-Run" \
            --layout structural

  # Aggregate gate — the main ruleset points at this single check. Client jobs
  # may be skipped only when a successful PR path filter proves they are
  # untouched; pushes and manual runs require both client jobs to succeed.
  ci:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [changes, personal-info-guard, version-drift, workflow-lint, rust, ios, mac]
    if: always()
    env:
      RESULT_CHANGES: ${{ needs.changes.result }}
      RESULT_GUARD: ${{ needs.personal-info-guard.result }}
      RESULT_VERSION: ${{ needs.version-drift.result }}
      RESULT_WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
      RESULT_RUST: ${{ needs.rust.result }}
      RESULT_IOS: ${{ needs.ios.result }}
      RESULT_MAC: ${{ needs.mac.result }}
      REQUIRE_IOS: ${{ needs.changes.outputs.ios_required }}
      REQUIRE_MAC: ${{ needs.changes.outputs.mac_required }}
    steps:
      - name: Verify all required jobs passed
        run: |
          fail=0
          for name in CHANGES GUARD VERSION WORKFLOW_LINT RUST; do
            var="RESULT_$name"
            result="${!var}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name job: $result"; fail=1
            fi
          done
          for name in IOS MAC; do
            var="RESULT_$name"
            result="${!var}"
            required_var="REQUIRE_$name"
            required="${!required_var}"
            [[ "$result" == "success" ]] && continue
            [[ "$required" == "false" && "$result" == "skipped" ]] && continue
            echo "::error::$name job: $result"; fail=1
          done
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "All required jobs passed."
