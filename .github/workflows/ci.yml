# Authoritative merge validation.
#
# Draft PRs use fast-feedback.yml. Ready PRs run the complete Rust/iOS/Mac
# matrix and publish immutable evidence for the exact synthetic merge tree.
# A main push reuses that evidence only when its tree and GitHub artifact digest
# match exactly; every unavailable, stale, ambiguous, or malformed case falls
# back to the complete matrix. Release workflows still wait for this workflow's
# successful exact-main-SHA conclusion.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel previous in-flight runs for the same PR to avoid macOS minute waste.
# Pushes to main never cancel — full-history validation is the goal there.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: Resolve validation provenance
    runs-on: ubuntu-latest
    outputs:
      full_required: ${{ steps.mode.outputs.full_required }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve validation mode
        id: mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            echo "full_required=false" >> "$GITHUB_OUTPUT"
            echo "mode=draft" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if python3 scripts/ci-validation-evidence.py verify --output build/reused-validation-evidence.json; then
              echo "full_required=false" >> "$GITHUB_OUTPUT"
              echo "mode=reused" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Exact PR evidence unavailable; running the complete validation matrix."
              echo "full_required=true" >> "$GITHUB_OUTPUT"
              echo "mode=fallback" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "full_required=true" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  personal-info-guard:
    name: Personal-info guard
    runs-on: ubuntu-latest
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run personal-info-guard
        run: ./scripts/personal-info-guard.sh

  version-drift:
    name: Version drift
    runs-on: ubuntu-latest
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check centralized version mirrors
        run: ./scripts/tron version check
      - name: Run version helper tests
        run: ./scripts/tron version test
      - name: Run release notes helper tests
        run: ./scripts/tron-release-notes --test
      - name: Run deterministic CI helper tests
        run: |
          ./scripts/ci-change-flags.sh --self-test
          ./scripts/ios-release-runner-doctor.sh --self-test
          python3 scripts/ci-validation-evidence.py --self-test
          python3 scripts/ios-test-selection.py --self-test
          python3 scripts/benchmarks/bench.py --self-test
          python3 scripts/evaluation/whole-agent.py --self-test

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: packages/agent
          # `scripts/tron ci` owns the explicit warning policy.
          rustflags: ""

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Formatting
        run: scripts/tron ci fmt
      - name: Compile check
        run: scripts/tron ci check
      - name: Clippy
        run: scripts/tron ci clippy
      - name: Tests
        run: scripts/tron ci test

  ios:
    name: iOS (measured build + test)
    runs-on: macos-15
    timeout-minutes: 25
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    outputs:
      metrics: ${{ steps.metrics.outputs.metrics }}
    defaults:
      run:
        working-directory: packages/ios-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify iOS release runner bootstrap and user-context primitives
        run: |
          ../../scripts/bootstrap-ios-release-runner.sh --self-test
          ../../scripts/ios-release-user-context /usr/bin/true

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Install checksum-pinned tools
        run: ../../scripts/install-ci-tools.sh xcodegen

      - name: Verify pinned toolchain
        run: ../../scripts/verify-ci-toolchain.sh ios xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available iOS simulators
        run: xcrun simctl list devices available | head -60

      - name: Measured build and test
        run: ../../scripts/ios-ci-test.sh

      - name: Export sanitized metrics
        id: metrics
        run: echo "metrics=$(jq -c . build/ios-ci-metrics.json)" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized iOS metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ci-metrics
          path: packages/ios-app/build/ios-ci-metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: packages/ios-app/build/TestResults.xcresult
          retention-days: 7

  mac:
    name: Mac wrapper (build + test, dry-run DMG)
    runs-on: macos-15
    needs: provenance
    if: needs.provenance.outputs.full_required == 'true'
    defaults:
      run:
        working-directory: packages/mac-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      # The Rust agent is embedded as a Resource in the Mac app bundle.
      # CI builds a debug-profile copy so `scripts/bundle-agent.sh`
      # succeeds, but we don't ship this binary — the release pipeline
      # (release-mac.yml) rebuilds it in `--release` with signing.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: packages/agent
          rustflags: "-D warnings"

      - name: Build agent helper (debug, for embedding)
        working-directory: packages/agent
        run: cargo build --bin tron --locked

      - name: Install checksum-pinned tools
        run: ../../scripts/install-ci-tools.sh xcodegen create-dmg

      - name: Verify pinned toolchain
        run: ../../scripts/verify-ci-toolchain.sh xcode xcodegen create-dmg

      - name: Stage agent helper binary
        run: ./scripts/bundle-agent.sh --skip-build --profile debug

      - name: Validate staged helper binary
        run: |
          test -x "Sources/Resources/Library/LoginItems/Tron Server.app/Contents/MacOS/tron"

      - name: Generate Xcode project
        run: xcodegen generate

      # Build the TronMac scheme in Debug and compile its unit-test bundle;
      # ad-hoc signing (CODE_SIGN_IDENTITY="-") keeps this portable to any
      # macOS runner without importing the Developer ID certificate.
      #
      # GitHub's hosted app-hosted macOS test runner can wedge before Swift
      # Testing starts. `build-for-testing` still catches Swift compile/link
      # drift in the app + tests without launching the UI process. Run the
      # app-hosted Mac tests locally from Xcode when changing wrapper logic.
      - name: xcodebuild build-for-testing
        timeout-minutes: 15
        env:
          TRON_MAC_TEST_HOST: "1"
        run: |
          set -o pipefail
          destination="platform=macOS,arch=$(uname -m)"
          xcodebuild build-for-testing \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -destination "$destination" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet

      - name: xcodebuild focused wrapper tests
        timeout-minutes: 20
        env:
          TRON_MAC_TEST_HOST: "1"
        run: |
          set -o pipefail
          destination="platform=macOS,arch=$(uname -m)"
          xcodebuild test \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -destination "$destination" \
            -configuration Debug \
            -only-testing:TronMacTests/TronPathsTests \
            -only-testing:TronMacTests/ServerStatusPollerTests \
            -only-testing:TronMacTests/TailscaleProbeTests \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet

      # Dry-run the package-owned DMG transaction on PRs without signing,
      # notarization, or publication. The release workflow retains release
      # orchestration; scripts/package-dmg.sh owns assembly and mount proof.
      - name: Dry-run DMG assembly
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p build
          # Xcode 26 adds an unsigned __preview.dylib to generic Debug builds;
          # packaging validation does not need previews and re-signs the app.
          xcodebuild \
            -project TronMac.xcodeproj \
            -scheme TronMac \
            -configuration Debug \
            -derivedDataPath build/dd \
            -destination 'generic/platform=macOS' \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            -quiet build
          APP_PATH="$(find build/dd -name 'TronMac.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "::error::TronMac.app not produced by debug build"
            exit 1
          fi
          mkdir -p dist
          DMG_PATH="$(pwd)/dist/Tron-dryrun.dmg"
          ./scripts/package-dmg.sh \
            --app "$APP_PATH" \
            --output "$DMG_PATH" \
            --volume-name "Tron Dry-Run" \
            --layout structural

  # The ruleset points at this single fail-closed check. Its draft-only name is
  # intentionally different, so draft feedback can never satisfy merge policy.
  ci:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft validation' || 'CI summary' }}
    runs-on: ubuntu-latest
    needs: [provenance, personal-info-guard, version-drift, workflow-lint, rust, ios, mac]
    if: always()
    env:
      RESULT_PROVENANCE: ${{ needs.provenance.result }}
      RESULT_GUARD: ${{ needs.personal-info-guard.result }}
      RESULT_VERSION: ${{ needs.version-drift.result }}
      RESULT_WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
      RESULT_RUST: ${{ needs.rust.result }}
      RESULT_IOS: ${{ needs.ios.result }}
      RESULT_MAC: ${{ needs.mac.result }}
      FULL_REQUIRED: ${{ needs.provenance.outputs.full_required }}
      VALIDATION_MODE: ${{ needs.provenance.outputs.mode }}
    steps:
      - name: Verify all required jobs passed
        run: |
          fail=0
          if [[ "$RESULT_PROVENANCE" != "success" ]]; then
            echo "::error::PROVENANCE job: $RESULT_PROVENANCE"; exit 1
          fi
          if [[ "$FULL_REQUIRED" == "false" ]]; then
            for name in GUARD VERSION WORKFLOW_LINT RUST IOS MAC; do
              var="RESULT_$name"
              result="${!var}"
              if [[ "$result" != "skipped" ]]; then
                echo "::error::$name must be skipped in $VALIDATION_MODE mode: $result"; fail=1
              fi
            done
            if [[ $fail -ne 0 ]]; then exit 1; fi
            echo "Validation mode: $VALIDATION_MODE"
            exit 0
          fi
          for name in GUARD VERSION WORKFLOW_LINT RUST IOS MAC; do
            var="RESULT_$name"
            result="${!var}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name job: $result"; fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then exit 1; fi
          echo "All required jobs passed."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        with:
          ref: ${{ github.sha }}
      - name: Create merge validation evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          TRON_PR_NUMBER: ${{ github.event.pull_request.number }}
          TRON_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRON_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRON_IOS_METRICS_JSON: ${{ needs.ios.outputs.metrics }}
        run: python3 scripts/ci-validation-evidence.py create --output build/validation-evidence.json
      - name: Upload merge validation evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tron-merge-validation
          path: build/validation-evidence.json
          if-no-files-found: error
          retention-days: 30
