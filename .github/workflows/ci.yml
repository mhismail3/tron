name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json
      - run: npm ci
        working-directory: packages/gateway
      - run: npm run build
        working-directory: packages/gateway
      - run: npm test
        working-directory: packages/gateway
      - run: npm audit --omit=dev
        working-directory: packages/gateway
      - run: scripts/personal-info-guard.sh

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: packages/ios-app
      - run: scripts/ios-ci-test.sh
      - name: Build iOS UI-test products once
        run: |
          TRON_IOS_DESTINATION='platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro' \
          scripts/ios-gateway-e2e-test prepare
          TRON_IOS_DESTINATION='platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro' \
          scripts/ios-gateway-e2e-test build
      - name: Run iOS smoke UI test without rebuilding
        working-directory: packages/ios-app
        run: |
          xcodebuild test-without-building -project TronMobile.xcodeproj -scheme 'Tron UI Validation' \
            -configuration Test \
            -destination 'platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro' \
            -derivedDataPath "${TMPDIR:-/tmp}/tron-ios-gateway-e2e-derived-$UID" \
            -only-testing:TronMobileUITests/TronSmokeUITests \
            -collect-test-diagnostics never
      - name: Run real gateway-to-iOS E2E without rebuilding
        run: |
          TRON_IOS_DESTINATION='platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro' \
          scripts/ios-gateway-e2e-test run

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json
      - run: brew install xcodegen
      - run: npm ci && npm run build
        working-directory: packages/gateway
      - run: packages/mac-app/scripts/bundle-gateway.sh --skip-install
      - run: xcodegen generate
        working-directory: packages/mac-app
      - name: Build Mac test products
        working-directory: packages/mac-app
        run: |
          xcodebuild build-for-testing -project TronMac.xcodeproj -scheme TronMac \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            -derivedDataPath build/ci-derived-data
      - name: Run Mac tests without rebuilding
        working-directory: packages/mac-app
        run: |
          xcodebuild test-without-building -project TronMac.xcodeproj -scheme TronMac \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            -derivedDataPath build/ci-derived-data -collect-test-diagnostics never
