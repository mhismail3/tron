name: CI
# Landing verifies each change locally (`scripts/tron work land`) and merges without
# waiting on hosted checks. This workflow runs on pushes to main and on demand, as a
# regression signal that the dashboard reports; it does not gate pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A started main run must finish; a newer main push queues behind it.
  group: ci-main
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json
      - run: npm ci
        working-directory: packages/gateway
      - run: npm run check
        working-directory: packages/gateway
      - run: npm test
        working-directory: packages/gateway

  push-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/push-relay/package-lock.json
      - run: npm ci
        working-directory: packages/push-relay
      - run: npm run check
        working-directory: packages/push-relay
      - run: npm run build
        working-directory: packages/push-relay

  ios:
    runs-on: macos-26
    # The memory reserve protects a shared development Mac's Gateway. A hosted
    # runner is a dedicated VM whose whole memory (7 GB) is below the 8 GB
    # default, so the default refuses every boot here (#113).
    env:
      TRON_IOS_TEST_MEMORY_RESERVE_BYTES: "0"
      TRON_IOS_TEST_EPHEMERAL: "1"
      TRON_IOS_TEST_DEVICE_NAME: "Tron iOS Build CI ${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Resolve canonical iOS Xcode
        id: ios-toolchain
        run: |
          source config/ci-toolchain.env
          echo "xcode=$TRON_CI_XCODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ steps.ios-toolchain.outputs.xcode }}
      - run: scripts/install-ci-tools.sh xcodegen
      - run: scripts/verify-ci-toolchain.sh node ios xcodegen
      - name: Build iOS test products
        run: scripts/tron-ios-test build
      - name: Delete only the CI-owned simulator
        if: always()
        run: scripts/ios-ci-test.sh cleanup

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json
      - name: Resolve canonical Mac Xcode
        id: mac-toolchain
        run: |
          source config/ci-toolchain.env
          echo "xcode=$TRON_CI_XCODE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ steps.mac-toolchain.outputs.xcode }}
      - run: scripts/install-ci-tools.sh xcodegen
      - run: scripts/verify-ci-toolchain.sh node xcode xcodegen
      - run: packages/mac-app/scripts/bundle-gateway.sh
      - run: scripts/tron mac generate
      # Compile only. The app-hosted TronMacTests need the team's Mac Development
      # certificate, which CI does not hold; they run locally (packages/mac-app/docs/development.md).
      - name: Compile Mac app and test sources unsigned
        working-directory: packages/mac-app
        run: |
          xcodebuild build-for-testing -project TronMac.xcodeproj -scheme TronMac \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            -derivedDataPath build/ci-derived-data CODE_SIGNING_ALLOWED=NO
