# iOS TestFlight Delivery Pipeline
#
# Every successful main-branch CI push uploads the exact tested production iOS
# bundle (`com.tron.mobile`) to the all-build internal TestFlight group. Release
# tags retain the external/public TestFlight path and Beta App Review handling.
# Both channels use this workflow's monotonic GITHUB_RUN_NUMBER as the hosted
# iOS CFBundleVersion; reruns reuse their original number. VERSION.env remains
# the product-version and local/Mac build source.
#
# Required secrets:
#   ASC_KEY_ID        App Store Connect API key id
#   ASC_ISSUER_ID     App Store Connect issuer id
#   ASC_KEY_P8_BASE64 base64-encoded private key contents for the API key
#
# Optional signing secrets for deterministic GitHub Actions exports when Xcode
# cloud signing is unavailable for the ASC API key:
#   IOS_DISTRIBUTION_CERT_P12_BASE64            base64-encoded Apple Distribution .p12
#   IOS_DISTRIBUTION_CERT_PASSWORD              password for that .p12
#   IOS_APPSTORE_PROFILE_BASE64                 base64-encoded App Store profile for com.tron.mobile
#   IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 base64-encoded App Store profile for com.tron.mobile.ShareExtension
#
# Repository variables:
#   ASC_TESTFLIGHT_PUBLIC_GROUP_ID   existing public TestFlight group id
#   ASC_TESTFLIGHT_INTERNAL_GROUP_ID all-build internal TestFlight group id
#
# Real releases archive the Prod app, export with Apple's app-store-connect
# method, then upload with `asc builds upload`. Exports use explicit manual
# signing when the optional iOS signing secrets are configured; without those
# optional secrets they use Xcode cloud signing through the ASC API key. The app
# declares `ITSAppUsesNonExemptEncryption=false`; CI also patches reused builds that were
# uploaded before that key existed so idempotent reruns can still distribute.
# Dry-runs still create an unsigned IPA from the archive to validate package
# layout without requiring Apple signing credentials. Only an explicit manual
# dry-run may omit the ASC credentials; live internal/external deliveries fail
# before the build when any required credential is missing.
#
# Credential lifecycle invariant: ASC uses the job's environment-backed key
# directly. Manual signing snapshots the user keychain preferences before it
# prepends and selects a job-owned keychain. One final `if: always()` step
# restores those preferences and removes the private key, certificate, created
# profiles, and keychain without deleting state that predated the job.

name: Release (iOS TestFlight)

on:
  push:
    tags:
      - "server-v*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Delivery channel. Live modes are restricted to main."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - internal
          - external

permissions:
  contents: read

jobs:
  testflight:
    name: Build + upload + distribute
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_APP_ID: "6761511764"
      IOS_APP_DIR: packages/ios-app
      IOS_SCHEME: Tron
      IOS_CONFIGURATION: Prod
      IOS_BUNDLE_ID: com.tron.mobile
      IOS_SHARE_EXTENSION_BUNDLE_ID: com.tron.mobile.ShareExtension
      APPLE_TEAM_ID: MYGKXH6TY4
      IOS_DISTRIBUTION_IDENTITY: Apple Distribution

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve iOS delivery
        id: ver
        shell: bash
        env:
          TRON_IOS_CHANNEL_INPUT: ${{ inputs.channel }}
          TRON_UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRON_UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          TRON_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRON_UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRON_UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ./scripts/tron version github-ios-output

      - name: Initialize ASC diagnostics
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="$RUNNER_TEMP/ios-asc-diagnostics"
          mkdir -p "$diagnostics_dir"
          echo "ASC_DIAGNOSTICS_DIR=$diagnostics_dir" >> "$GITHUB_ENV"

      - name: Require live iOS credentials
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          required_secrets=(ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64)
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            [[ -n "${!secret_name:-}" ]] || missing_secrets+=("$secret_name")
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            echo "::error::live iOS delivery requires secrets: ${missing_secrets[*]}"
            exit 1
          fi
          echo "Live iOS credentials are configured for ${{ steps.ver.outputs.channel }} delivery"

      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Install checksum-pinned tools
        run: scripts/install-ci-tools.sh xcodegen asc

      - name: Verify pinned toolchain
        run: scripts/verify-ci-toolchain.sh ios xcodegen asc

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_APP_DIR }}
        run: xcodegen generate

      - name: Verify release build settings
        working-directory: ${{ env.IOS_APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$RUNNER_TEMP/ios-build-settings.txt"
          xcodebuild -showBuildSettings \
            -project TronMobile.xcodeproj \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.apple_build }}" > "$settings"
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID" "$settings"
          grep -q "MARKETING_VERSION = ${{ steps.ver.outputs.marketing_version }}" "$settings"
          grep -q "CURRENT_PROJECT_VERSION = ${{ steps.ver.outputs.apple_build }}" "$settings"
          grep -q "TRON_CANONICAL_VERSION = ${{ steps.ver.outputs.version }}" "$settings"

      - name: Prepare iOS simulator
        if: steps.ver.outputs.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source config/ci-toolchain.env
          runtimes_json="$RUNNER_TEMP/sim-runtimes.json"
          devices_json="$RUNNER_TEMP/sim-devices.json"
          xcrun simctl list runtimes available --json > "$runtimes_json"
          runtime_id="$(
            jq -r --arg version "$TRON_CI_IOS_RUNTIME_VERSION" '
              [.runtimes[]
                | select(.platform == "iOS" and .version == $version and .isAvailable == true)
                | select((.supportedDeviceTypes // []) | map(select(.productFamily == "iPhone")) | length > 0)]
              | .[0].identifier // empty
            ' "$runtimes_json"
          )"
          if [[ -z "$runtime_id" ]]; then
            echo "::error::pinned iOS $TRON_CI_IOS_RUNTIME_VERSION simulator runtime is unavailable"
            exit 1
          fi
          device_type="$(
            jq -r --arg runtime_id "$runtime_id" --arg device_name "$TRON_CI_IOS_SIMULATOR_NAME" '
              [.runtimes[] | select(.identifier == $runtime_id)][0]
              | (.supportedDeviceTypes // []) as $types
              | ($types | map(select(.name == $device_name)))
              | .[0].identifier // empty
            ' "$runtimes_json"
          )"
          device_name="$TRON_CI_IOS_SIMULATOR_NAME"
          if [[ -z "$device_type" ]]; then
            echo "::error::pinned simulator $device_name is unavailable on $runtime_id"
            exit 1
          fi

          xcrun simctl list devices available --json > "$devices_json"
          udid="$(
            jq -r --arg runtime_id "$runtime_id" --arg device_name "$device_name" '
              (.devices[$runtime_id] // [])
              | map(select(.isAvailable == true and .name == $device_name))
              | .[0].udid // empty
            ' "$devices_json"
          )"
          if [[ -z "$udid" ]]; then
            udid="$(xcrun simctl create "Tron CI $device_name" "$device_type" "$runtime_id")"
            echo "::notice::created $device_name simulator $udid on $runtime_id"
          else
            echo "::notice::using existing $device_name simulator $udid on $runtime_id"
          fi
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_TEST_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: xcodebuild test
        if: steps.ver.outputs.run_tests == 'true'
        working-directory: ${{ env.IOS_APP_DIR }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project TronMobile.xcodeproj \
            -scheme "$IOS_SCHEME" \
            -configuration Beta \
            -destination "$IOS_TEST_DESTINATION" \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload xcresult on failure
        if: failure() && steps.ver.outputs.run_tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release-test-results
          path: packages/ios-app/TestResults.xcresult
          retention-days: 7

      - name: Prepare ASC API key
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/tron-asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$key_path"
          test -s "$key_path" || { echo "::error::decoded ASC private key is empty"; exit 1; }
          export ASC_PRIVATE_KEY_PATH="$key_path"
          export ASC_BYPASS_KEYCHAIN=true
          export ASC_STRICT_AUTH=true
          asc auth status
          {
            echo "APPLE_API_KEY_ID=$ASC_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_PRIVATE_KEY_PATH=$key_path"
            echo "ASC_STRICT_AUTH=true"
            echo "ASC_BYPASS_KEYCHAIN=true"
          } >> "$GITHUB_ENV"

      - name: Validate internal TestFlight group
        id: internal_group
        if: steps.ver.outputs.channel == 'internal'
        shell: bash
        env:
          INTERNAL_GROUP_ID: ${{ vars.ASC_TESTFLIGHT_INTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$ASC_DIAGNOSTICS_DIR"
          [[ -n "${INTERNAL_GROUP_ID:-}" ]] || {
            echo "::error::ASC_TESTFLIGHT_INTERNAL_GROUP_ID is required for automatic internal delivery"
            exit 1
          }

          groups_json="$ASC_DIAGNOSTICS_DIR/internal-groups.json"
          asc testflight groups list \
            --app "$ASC_APP_ID" \
            --output json > "$groups_json"
          group="$(
            jq -c --arg id "$INTERNAL_GROUP_ID" '
              (.data // [])
              | map(select(.id == $id))
              | .[0] // empty
            ' "$groups_json"
          )"
          [[ -n "$group" ]] || {
            echo "::error::ASC_TESTFLIGHT_INTERNAL_GROUP_ID does not match a TestFlight group"
            exit 1
          }
          internal_kind="$(jq -r '.attributes.isInternalGroup // false' <<< "$group")"
          all_builds="$(jq -r '.attributes.hasAccessToAllBuilds // false' <<< "$group")"
          group_name="$(jq -r '.attributes.name // "<unnamed internal group>"' <<< "$group")"
          [[ "$internal_kind" == "true" ]] || {
            echo "::error::configured internal TestFlight group '$group_name' is external"
            exit 1
          }
          [[ "$all_builds" == "true" ]] || {
            echo "::error::internal TestFlight group '$group_name' must have automatic all-build access enabled"
            exit 1
          }

          asc_token() {
            ./scripts/asc-jwt \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer-id "$APPLE_API_ISSUER_ID" \
              --key-path "$APPLE_API_KEY_PATH"
          }
          testers_json="$RUNNER_TEMP/internal-group-testers.json"
          http_code="$(
            curl -sS --retry 4 --retry-delay 3 \
              -o "$testers_json" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $(asc_token)" \
              -H "Accept: application/json" \
              "https://api.appstoreconnect.apple.com/v1/betaGroups/$INTERNAL_GROUP_ID/betaTesters?limit=1"
          )"
          [[ "$http_code" == 2* ]] || {
            rm -f "$testers_json"
            echo "::error::failed to verify internal TestFlight group membership (HTTP $http_code)"
            exit 1
          }
          tester_count="$(jq -r '(.data // []) | length' "$testers_json")"
          rm -f "$testers_json"
          (( tester_count > 0 )) || {
            echo "::error::internal TestFlight group '$group_name' has no testers; add the intended App Store Connect user before retrying"
            exit 1
          }
          echo "group_id=$INTERNAL_GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::internal TestFlight group '$group_name' is configured for automatic all-build access"

      - name: Check for existing ASC build
        id: existing
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_json="$RUNNER_TEMP/existing-build.json"
          if ! asc builds list \
              --app "$ASC_APP_ID" \
              --version "${{ steps.ver.outputs.marketing_version }}" \
              --build-number "${{ steps.ver.outputs.apple_build }}" \
              --limit 10 \
              --output json > "$build_json"; then
            echo "::error::failed to query App Store Connect for existing build ${{ steps.ver.outputs.apple_build }}"
            exit 1
          fi

          build_id="$(jq -r '(.data // []) | if type == "array" then .[0].id // empty else .id // empty end' "$build_json")"
          if [[ -n "$build_id" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
            echo "::notice::ASC build ${{ steps.ver.outputs.apple_build }} already exists ($build_id); upload will be skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve iOS signing mode
        id: signing
        if: steps.ver.outputs.dry_run != 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          manual_values=0
          for value in \
            "$IOS_DISTRIBUTION_CERT_P12_BASE64" \
            "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            "$IOS_APPSTORE_PROFILE_BASE64" \
            "$IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64"; do
            [[ -n "$value" ]] && manual_values=$((manual_values + 1))
          done

          if [[ "$manual_values" -eq 0 ]]; then
            echo "IOS_SIGNING_MODE=automatic" >> "$GITHUB_ENV"
            echo "mode=automatic" >> "$GITHUB_OUTPUT"
            echo "::notice::using automatic Xcode cloud signing for the App Store IPA export"
          elif [[ "$manual_values" -eq 4 ]]; then
            echo "IOS_SIGNING_MODE=manual" >> "$GITHUB_ENV"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "::notice::using manual App Store signing secrets for the App Store IPA export"
          else
            echo "::error::iOS manual signing secrets are partially configured. Set IOS_DISTRIBUTION_CERT_P12_BASE64, IOS_DISTRIBUTION_CERT_PASSWORD, IOS_APPSTORE_PROFILE_BASE64, and IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 together, or remove all four to use automatic cloud signing."
            exit 1
          fi

      - name: Prepare manual iOS signing assets
        if: steps.ver.outputs.dry_run != 'true' && steps.existing.outputs.exists != 'true' && steps.signing.outputs.mode == 'manual'
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          cert_path="$RUNNER_TEMP/ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/ios-signing.keychain-db"
          keychain_password="$(uuidgen)"
          original_keychains_path="$RUNNER_TEMP/ios-original-keychains"
          original_default_path="$RUNNER_TEMP/ios-original-default-keychain"
          snapshot_ready="$RUNNER_TEMP/ios-keychain-snapshot-ready"
          installed_profile_uuids="$RUNNER_TEMP/ios-installed-profile-uuids"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          : > "$original_keychains_path"
          : > "$installed_profile_uuids"

          original_keychains=()
          keychain_list="$(security list-keychains -d user)"
          while IFS= read -r existing_keychain; do
            existing_keychain="${existing_keychain#"${existing_keychain%%[![:space:]]*}"}"
            existing_keychain="${existing_keychain%"${existing_keychain##*[![:space:]]}"}"
            existing_keychain="${existing_keychain#\"}"
            existing_keychain="${existing_keychain%\"}"
            if [[ -n "$existing_keychain" ]]; then
              original_keychains+=("$existing_keychain")
              printf '%s\n' "$existing_keychain" >> "$original_keychains_path"
            fi
          done <<< "$keychain_list"
          if (( ${#original_keychains[@]} == 0 )); then
            echo "::error::user keychain search list is empty"
            exit 1
          fi
          original_default="$(security default-keychain -d user)"
          original_default="${original_default#"${original_default%%[![:space:]]*}"}"
          original_default="${original_default%"${original_default##*[![:space:]]}"}"
          original_default="${original_default#\"}"
          original_default="${original_default%\"}"
          if [[ -z "$original_default" ]]; then
            echo "::error::user default keychain is empty"
            exit 1
          fi
          printf '%s\n' "$original_default" > "$original_default_path"
          : > "$snapshot_ready"

          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -d > "$cert_path"
          test -s "$cert_path" || { echo "::error::decoded iOS distribution certificate is empty"; exit 1; }
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          rm -f "$cert_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -q "$IOS_DISTRIBUTION_IDENTITY" || {
            echo "::error::imported .p12 does not contain an $IOS_DISTRIBUTION_IDENTITY signing identity"
            exit 1
          }

          install_profile() {
            local label="$1" bundle_id="$2" base64_value="$3"
            local profile_path decoded_plist uuid name application_id provisions_all xcode_managed destination
            profile_path="$RUNNER_TEMP/$label.mobileprovision"
            decoded_plist="$RUNNER_TEMP/$label-profile.plist"
            printf '%s' "$base64_value" | base64 -d > "$profile_path"
            security cms -D -i "$profile_path" -o "$decoded_plist"

            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded_plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$decoded_plist")"
            application_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded_plist" 2>/dev/null || true)"
            provisions_all="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$decoded_plist" 2>/dev/null || true)"
            xcode_managed="$(/usr/libexec/PlistBuddy -c 'Print :IsXcodeManaged' "$decoded_plist" 2>/dev/null || true)"
            [[ "$xcode_managed" == "true" ]] || xcode_managed="false"

            if [[ -z "$uuid" ]]; then
              echo "::error::$label provisioning profile is missing a UUID" >&2
              return 1
            fi
            if [[ ! "$uuid" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
              echo "::error::$label provisioning profile has invalid UUID '$uuid'" >&2
              return 1
            fi
            if [[ "$application_id" != "$APPLE_TEAM_ID.$bundle_id" ]]; then
              echo "::error::$label provisioning profile is for '$application_id', expected '$APPLE_TEAM_ID.$bundle_id'" >&2
              return 1
            fi
            if [[ "$provisions_all" == "true" ]] || /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$decoded_plist" >/dev/null 2>&1; then
              echo "::error::$label provisioning profile is not an App Store Connect distribution profile" >&2
              return 1
            fi

            destination="$profiles_dir/$uuid.mobileprovision"
            if [[ -L "$destination" ]]; then
              echo "::error::$label provisioning profile destination is a symlink: $destination" >&2
              return 1
            elif [[ -e "$destination" ]]; then
              if ! cmp -s "$profile_path" "$destination"; then
                echo "::error::$label provisioning profile UUID collides with different existing content" >&2
                return 1
              fi
              echo "::notice::reusing existing App Store profile '$name' for $bundle_id" >&2
            else
              printf '%s\n' "$uuid" >> "$installed_profile_uuids"
              /bin/cp "$profile_path" "$destination"
              echo "::notice::installed temporary App Store profile '$name' for $bundle_id" >&2
            fi
            rm -f "$profile_path" "$decoded_plist"
            printf '%s\t%s' "$uuid" "$xcode_managed"
          }

          app_profile_info="$(install_profile app "$IOS_BUNDLE_ID" "$IOS_APPSTORE_PROFILE_BASE64")"
          share_profile_info="$(install_profile share-extension "$IOS_SHARE_EXTENSION_BUNDLE_ID" "$IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64")"
          app_profile_uuid="${app_profile_info%%$'\t'*}"
          app_profile_xcode_managed="${app_profile_info##*$'\t'}"
          share_profile_uuid="${share_profile_info%%$'\t'*}"
          share_profile_xcode_managed="${share_profile_info##*$'\t'}"

          if [[ "$app_profile_xcode_managed" != "$share_profile_xcode_managed" ]]; then
            echo "::error::iOS App Store profiles must both be Xcode-managed or both be manually managed"
            exit 1
          fi

          if [[ "$app_profile_xcode_managed" == "true" ]]; then
            export_signing_style="automatic-local"
            echo "::notice::using automatic export style because the App Store profiles are Xcode-managed"
          else
            export_signing_style="manual"
          fi

          {
            echo "IOS_APP_PROFILE_UUID=$app_profile_uuid"
            echo "IOS_SHARE_PROFILE_UUID=$share_profile_uuid"
            echo "IOS_EXPORT_SIGNING_STYLE=$export_signing_style"
          } >> "$GITHUB_ENV"

      - name: xcodebuild archive
        if: steps.ver.outputs.dry_run == 'true' || steps.existing.outputs.exists != 'true'
        working-directory: ${{ env.IOS_APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$(pwd)/build/TronMobile.xcarchive"
          rm -rf "$archive_path"
          if [[ "${{ steps.ver.outputs.dry_run }}" == "true" ]]; then
            xcodebuild archive \
              -project TronMobile.xcodeproj \
              -scheme "$IOS_SCHEME" \
              -configuration "$IOS_CONFIGURATION" \
              -archivePath "$archive_path" \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.apple_build }}" \
              -quiet
          else
            xcodebuild archive \
              -project TronMobile.xcodeproj \
              -scheme "$IOS_SCHEME" \
              -configuration "$IOS_CONFIGURATION" \
              -archivePath "$archive_path" \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$APPLE_API_KEY_PATH" \
              -authenticationKeyID "$APPLE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.apple_build }}" \
              -quiet
          fi
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Verify archive
        if: steps.ver.outputs.dry_run == 'true' || steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$ARCHIVE_PATH/Products/Applications/TronMobile.app"
          test -d "$app_path" || { echo "::error::archive missing TronMobile.app"; exit 1; }
          plist="$app_path/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${{ steps.ver.outputs.marketing_version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${{ steps.ver.outputs.apple_build }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TRONCanonicalVersion' "$plist")" = "${{ steps.ver.outputs.version }}"
          appex_plist="$app_path/PlugIns/TronShareExtension.appex/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$appex_plist")" = "false"

      - name: Upload archive dSYMs
        if: steps.ver.outputs.dry_run == 'true' || steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-dsyms-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.apple_build }}
          path: packages/ios-app/build/TronMobile.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

      - name: Export App Store IPA
        if: steps.ver.outputs.dry_run != 'true' && steps.existing.outputs.exists != 'true'
        working-directory: ${{ env.IOS_APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$(pwd)/build/export"
          ipa_path="$(pwd)/build/TronMobile.ipa"
          export_options="$RUNNER_TEMP/ios-export-options.plist"
          rm -rf "$export_dir" "$ipa_path"
          mkdir -p "$export_dir"

          export_command_mode="automatic-cloud"
          if [[ "${IOS_SIGNING_MODE:-automatic}" == "manual" && "${IOS_EXPORT_SIGNING_STYLE:-manual}" == "manual" ]]; then
            export_command_mode="manual"
            cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>$IOS_APP_PROFILE_UUID</string>
              <key>$IOS_SHARE_EXTENSION_BUNDLE_ID</key>
              <string>$IOS_SHARE_PROFILE_UUID</string>
            </dict>
            <key>signingCertificate</key>
            <string>$IOS_DISTRIBUTION_IDENTITY</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          else
            if [[ "${IOS_SIGNING_MODE:-automatic}" == "manual" ]]; then
              export_command_mode="automatic-local"
            fi
            cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          fi
          plutil -lint "$export_options"

          if [[ "$export_command_mode" == "manual" || "$export_command_mode" == "automatic-local" ]]; then
            if ! xcodebuild -exportArchive \
                -archivePath "$ARCHIVE_PATH" \
                -exportPath "$export_dir" \
                -exportOptionsPlist "$export_options" \
                -quiet; then
              echo "::error::local App Store export failed. Confirm the .p12 matches the selected App Store provisioning profiles for $IOS_BUNDLE_ID and $IOS_SHARE_EXTENSION_BUNDLE_ID."
              exit 1
            fi
          else
            if ! xcodebuild -exportArchive \
                -archivePath "$ARCHIVE_PATH" \
                -exportPath "$export_dir" \
                -exportOptionsPlist "$export_options" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$APPLE_API_KEY_PATH" \
                -authenticationKeyID "$APPLE_API_KEY_ID" \
                -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
                -quiet; then
              echo "::error::automatic Xcode cloud signing failed. Grant the ASC API key/account permission to manage App Store signing, or configure the manual iOS signing secrets documented in packages/ios-app/docs/development.md."
              exit 1
            fi
          fi

          exported_ipa="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$exported_ipa" || { echo "::error::xcodebuild export did not produce an IPA"; exit 1; }
          /bin/cp -f "$exported_ipa" "$ipa_path"
          unzip -tq "$ipa_path"

          validation_dir="$RUNNER_TEMP/ios-ipa-validation"
          rm -rf "$validation_dir"
          mkdir -p "$validation_dir"
          unzip -q "$ipa_path" -d "$validation_dir"
          app_payload="$validation_dir/Payload/TronMobile.app"
          appex_payload="$app_payload/PlugIns/TronShareExtension.appex"
          test -d "$app_payload" || { echo "::error::exported IPA missing TronMobile.app"; exit 1; }
          test -d "$appex_payload" || { echo "::error::exported IPA missing TronShareExtension.appex"; exit 1; }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_payload/Info.plist")" = "$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$appex_payload/Info.plist")" = "$IOS_SHARE_EXTENSION_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app_payload/Info.plist")" = "false"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$appex_payload/Info.plist")" = "false"
          /usr/bin/codesign --verify --strict "$appex_payload"
          /usr/bin/codesign --verify --deep --strict "$app_payload"

          main_entitlements="$RUNNER_TEMP/main-entitlements.plist"
          share_entitlements="$RUNNER_TEMP/share-entitlements.plist"
          /usr/bin/codesign -d --entitlements :- "$app_payload" > "$main_entitlements" 2>/dev/null
          /usr/bin/codesign -d --entitlements :- "$appex_payload" > "$share_entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$main_entitlements")" = "$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$share_entitlements")" = "$APPLE_TEAM_ID.$IOS_SHARE_EXTENSION_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$main_entitlements")" = "$APPLE_TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$share_entitlements")" = "$APPLE_TEAM_ID"

          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Package dry-run IPA
        if: steps.ver.outputs.dry_run == 'true'
        working-directory: ${{ env.IOS_APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(pwd)/build/TronMobile.ipa"
          work_dir="$(pwd)/build/ipa_work"
          app_source="$ARCHIVE_PATH/Products/Applications/TronMobile.app"
          rm -rf "$work_dir" "$ipa_path"
          mkdir -p "$work_dir/Payload"
          /bin/cp -Rf "$app_source" "$work_dir/Payload/"
          echo "::notice::dry-run IPA is unsigned and is only used to validate package layout"
          (cd "$work_dir" && /usr/bin/zip -qry "$ipa_path" Payload)
          unzip -tq "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload dry-run IPA artifact
        if: steps.ver.outputs.dry_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-dry-run-ipa-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.apple_build }}
          path: packages/ios-app/build/TronMobile.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: steps.ver.outputs.dry_run != 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          asc builds upload \
            --app "$ASC_APP_ID" \
            --ipa "$IPA_PATH" \
            --version "${{ steps.ver.outputs.marketing_version }}" \
            --build-number "${{ steps.ver.outputs.apple_build }}" \
            --platform IOS \
            --checksum \
            --output json \
            --pretty

      - name: Wait for ASC processing
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          asc builds wait \
            --app "$ASC_APP_ID" \
            --build-number "${{ steps.ver.outputs.apple_build }}" \
            --platform IOS \
            --timeout 45m \
            --poll-interval 30s \
            --fail-on-invalid \
            --output json \
            --pretty

      - name: Resolve processed ASC build
        id: asc_build
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          build_json="$RUNNER_TEMP/processed-build.json"
          asc builds list \
            --app "$ASC_APP_ID" \
            --version "${{ steps.ver.outputs.marketing_version }}" \
            --build-number "${{ steps.ver.outputs.apple_build }}" \
            --limit 10 \
            --output json > "$build_json"
          build_id="$(jq -r '(.data // []) | if type == "array" then .[0].id // empty else .id // empty end' "$build_json")"
          test -n "$build_id" || { echo "::error::could not resolve processed ASC build id"; exit 1; }
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "::notice::resolved ASC build ${{ steps.ver.outputs.apple_build }} as $build_id"

      - name: Resolve export compliance
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        env:
          BUILD_ID: ${{ steps.asc_build.outputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p "$ASC_DIAGNOSTICS_DIR"

          detail_json="$ASC_DIAGNOSTICS_DIR/build-beta-detail.json"
          asc_token() {
            ./scripts/asc-jwt \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer-id "$APPLE_API_ISSUER_ID" \
              --key-path "$APPLE_API_KEY_PATH"
          }
          asc_get() {
            local url="$1" output="$2" http_code attempt
            for attempt in {1..5}; do
              http_code="$(
                curl -sS \
                  -o "$output" \
                  -w "%{http_code}" \
                  -H "Authorization: Bearer $(asc_token)" \
                  -H "Accept: application/json" \
                  "$url"
              )"
              [[ "$http_code" == 2* ]] && return 0
              if [[ "$http_code" == "429" || "$http_code" == 5* ]]; then
                echo "::warning::App Store Connect GET returned HTTP $http_code (attempt $attempt/5)"
                sleep $((attempt * 5))
                continue
              fi
              echo "::error::App Store Connect API GET failed (HTTP $http_code): $url"
              return 1
            done
            echo "::error::App Store Connect API GET exhausted retries: $url"
            return 1
          }
          fetch_detail() {
            asc_get "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID/buildBetaDetail" "$detail_json"
            internal_state="$(
              jq -r '.data.attributes.internalBuildState // empty' "$detail_json"
            )"
            external_state="$(
              jq -r '.data.attributes.externalBuildState // empty' "$detail_json"
            )"
            if [[ -z "$internal_state" || -z "$external_state" ]]; then
              echo "::error::could not read TestFlight build beta detail for $BUILD_ID"
              exit 1
            fi
          }

          fetch_detail
          echo "::notice::TestFlight states before export-compliance check: internal=$internal_state external=$external_state"
          if [[ "$internal_state" != "MISSING_EXPORT_COMPLIANCE" && "$external_state" != "MISSING_EXPORT_COMPLIANCE" ]]; then
            exit 0
          fi

          echo "::notice::ASC build $BUILD_ID is missing export compliance; setting usesNonExemptEncryption=false"
          request_body="$ASC_DIAGNOSTICS_DIR/build-export-compliance-request.json"
          response_body="$ASC_DIAGNOSTICS_DIR/build-export-compliance-response.json"
          jq -n --arg id "$BUILD_ID" '{
            data: {
              type: "builds",
              id: $id,
              attributes: {
                usesNonExemptEncryption: false
              }
            }
          }' > "$request_body"
          patch_accepted=false
          for attempt in {1..5}; do
            http_code="$(
              curl -sS \
                -o "$response_body" \
                -w "%{http_code}" \
                -X PATCH \
                -H "Authorization: Bearer $(asc_token)" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                --data-binary "@$request_body" \
                "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID"
            )"
            if [[ "$http_code" == 2* || "$http_code" == "409" ]]; then
              patch_accepted=true
              [[ "$http_code" == "409" ]] && echo "::notice::export-compliance update is already in progress; polling authoritative state"
              break
            fi
            if [[ "$http_code" == "429" || "$http_code" == 5* ]]; then
              echo "::warning::export-compliance PATCH returned HTTP $http_code (attempt $attempt/5)"
              sleep $((attempt * 5))
              continue
            fi
            echo "::error::failed to set usesNonExemptEncryption=false for ASC build $BUILD_ID (HTTP $http_code)"
            exit 1
          done
          [[ "$patch_accepted" == "true" ]] || {
            echo "::error::export-compliance PATCH exhausted retries for ASC build $BUILD_ID"
            exit 1
          }

          for _ in {1..30}; do
            fetch_detail
            echo "::notice::TestFlight states after export-compliance update: internal=$internal_state external=$external_state"
            if [[ "$internal_state" != "MISSING_EXPORT_COMPLIANCE" && "$external_state" != "MISSING_EXPORT_COMPLIANCE" ]]; then
              exit 0
            fi
            sleep 15
          done

          echo "::error::ASC build $BUILD_ID is still missing export compliance after 7.5 minutes"
          exit 1

      - name: Update TestFlight notes
        if: steps.ver.outputs.dry_run != 'true'
        shell: bash
        env:
          BUILD_ID: ${{ steps.asc_build.outputs.build_id }}
        run: |
          set -euo pipefail
          mkdir -p "$ASC_DIAGNOSTICS_DIR"
          short_sha="${{ steps.ver.outputs.source_sha }}"
          short_sha="${short_sha:0:12}"
          notes="Tron ${{ steps.ver.outputs.display_version }} (${{ steps.ver.outputs.version }}), Apple build ${{ steps.ver.outputs.apple_build }}, commit $short_sha, GitHub run $GITHUB_RUN_NUMBER."
          notes_error="$ASC_DIAGNOSTICS_DIR/testflight-notes-error.log"
          if asc builds test-notes update \
              --build "$BUILD_ID" \
              --locale en-US \
              --whats-new "$notes" \
              --output json \
              --pretty 2> "$notes_error"; then
            exit 0
          fi
          if asc builds test-notes create \
              --build "$BUILD_ID" \
              --locale en-US \
              --whats-new "$notes" \
              --output json \
              --pretty 2> "$notes_error"; then
            exit 0
          fi
          cat "$notes_error"
          echo "::error::failed to create or update TestFlight What to Test notes"
          exit 1

      - name: Wait for internal TestFlight availability
        id: internal_availability
        if: steps.ver.outputs.channel == 'internal'
        shell: bash
        env:
          BUILD_ID: ${{ steps.asc_build.outputs.build_id }}
          INTERNAL_GROUP_ID: ${{ steps.internal_group.outputs.group_id }}
        run: |
          set -euo pipefail
          mkdir -p "$ASC_DIAGNOSTICS_DIR"
          asc_token() {
            ./scripts/asc-jwt \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer-id "$APPLE_API_ISSUER_ID" \
              --key-path "$APPLE_API_KEY_PATH"
          }
          asc_get() {
            local url="$1" output="$2" http_code attempt
            for attempt in {1..5}; do
              http_code="$(
                curl -sS \
                  -o "$output" \
                  -w "%{http_code}" \
                  -H "Authorization: Bearer $(asc_token)" \
                  -H "Accept: application/json" \
                  "$url"
              )"
              [[ "$http_code" == 2* ]] && return 0
              if [[ "$http_code" == "429" || "$http_code" == 5* ]]; then
                echo "::warning::App Store Connect GET returned HTTP $http_code (attempt $attempt/5)"
                sleep $((attempt * 5))
                continue
              fi
              echo "::error::App Store Connect API GET failed (HTTP $http_code): $url"
              return 1
            done
            echo "::error::App Store Connect API GET exhausted retries: $url"
            return 1
          }

          detail_json="$ASC_DIAGNOSTICS_DIR/internal-build-detail.json"
          groups_json="$ASC_DIAGNOSTICS_DIR/internal-build-groups.json"
          for _ in {1..90}; do
            asc_get "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID/buildBetaDetail" "$detail_json"
            asc_get "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID/relationships/betaGroups?limit=200" "$groups_json"
            internal_state="$(jq -r '.data.attributes.internalBuildState // empty' "$detail_json")"
            group_attached="$(jq -r --arg id "$INTERNAL_GROUP_ID" 'any((.data // [])[]; .id == $id)' "$groups_json")"
            echo "::notice::internal TestFlight state=$internal_state group_attached=$group_attached"
            case "$internal_state" in
              READY_FOR_BETA_TESTING|IN_BETA_TESTING)
                if [[ "$group_attached" == "true" ]]; then
                  echo "internal_state=$internal_state" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              PROCESSING_EXCEPTION|EXPIRED)
                echo "::error::internal TestFlight state is $internal_state for ASC build $BUILD_ID"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::ASC build $BUILD_ID did not become available to the internal TestFlight group within 45 minutes"
          exit 1

      - name: Submit TestFlight beta review when required
        id: beta_review
        if: steps.ver.outputs.channel == 'external'
        shell: bash
        env:
          BUILD_ID: ${{ steps.asc_build.outputs.build_id }}
        run: |
          set -euo pipefail

          detail_json="$RUNNER_TEMP/beta-review-detail.json"
          submissions_json="$RUNNER_TEMP/beta-review-submissions.json"

          asc_token() {
            ./scripts/asc-jwt \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer-id "$APPLE_API_ISSUER_ID" \
              --key-path "$APPLE_API_KEY_PATH"
          }

          asc_get() {
            local url="$1" output="$2" http_code
            http_code="$(
              curl -sS \
                -o "$output" \
                -w "%{http_code}" \
                -H "Authorization: Bearer $(asc_token)" \
                -H "Accept: application/json" \
                "$url"
            )"
            if [[ "$http_code" != 2* ]]; then
              cat "$output"
              echo "::error::App Store Connect API GET failed (HTTP $http_code): $url"
              exit 1
            fi
          }

          fetch_external_state() {
            asc_get "https://api.appstoreconnect.apple.com/v1/builds/$BUILD_ID/buildBetaDetail" "$detail_json"
            external_state="$(
              jq -r '.data.attributes.externalBuildState // empty' "$detail_json"
            )"
            test -n "$external_state" || { echo "::error::could not read external TestFlight state"; cat "$detail_json"; exit 1; }
          }

          fetch_review_state() {
            asc_get "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions?filter%5Bbuild%5D=$BUILD_ID" "$submissions_json"
            review_state="$(
              jq -r '(.data // []) | sort_by(.attributes.submittedDate // "") | last | .attributes.betaReviewState // empty' "$submissions_json"
            )"
          }

          submit_beta_review() {
            request_body="$RUNNER_TEMP/beta-review-submission.json"
            response_body="$RUNNER_TEMP/beta-review-submission-response.json"
            jq -n --arg build_id "$BUILD_ID" '{
              data: {
                type: "betaAppReviewSubmissions",
                relationships: {
                  build: {
                    data: {
                      type: "builds",
                      id: $build_id
                    }
                  }
                }
              }
            }' > "$request_body"
            http_code="$(
              curl -sS \
                -o "$response_body" \
                -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $(asc_token)" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                --data-binary "@$request_body" \
                "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions"
            )"
            if [[ "$http_code" != 2* ]]; then
              cat "$response_body"
              echo "::error::failed to submit ASC build $BUILD_ID for TestFlight beta review (HTTP $http_code)"
              exit 1
            fi
          }

          write_outputs() {
            local external_ready="$1" review_pending="$2" disposition="$3"
            {
              echo "external_state=$external_state"
              echo "review_state=$review_state"
              echo "external_ready=$external_ready"
              echo "review_pending=$review_pending"
              echo "disposition=$disposition"
            } >> "$GITHUB_OUTPUT"
          }

          handle_terminal_state() {
            fetch_external_state
            fetch_review_state
            echo "::notice::external TestFlight state: $external_state; review=$review_state"

            case "$review_state" in
              REJECTED)
                echo "::error::TestFlight beta review rejected ASC build $BUILD_ID"
                exit 1
                ;;
              APPROVED)
                write_outputs true false approved
                exit 0
                ;;
            esac

            case "$external_state" in
              READY_FOR_BETA_TESTING|IN_BETA_TESTING|BETA_APPROVED|BETA_TESTING|AVAILABLE_FOR_EXTERNAL_TESTING)
                write_outputs true false externally-ready
                exit 0
                ;;
              WAITING_FOR_BETA_REVIEW|IN_BETA_REVIEW)
                echo "::notice::ASC build $BUILD_ID is waiting for Apple Beta App Review; treating this as a successful pending-review release checkpoint"
                write_outputs false true waiting-for-beta-review
                exit 0
                ;;
              BETA_REJECTED|EXPIRED|PROCESSING_EXCEPTION)
                echo "::error::external TestFlight state is $external_state for ASC build $BUILD_ID"
                exit 1
                ;;
            esac

            case "$review_state" in
              WAITING_FOR_REVIEW|IN_REVIEW)
                echo "::notice::ASC build $BUILD_ID is waiting for Apple Beta App Review; treating this as a successful pending-review release checkpoint"
                write_outputs false true waiting-for-beta-review
                exit 0
                ;;
            esac
          }

          fetch_external_state
          fetch_review_state
          echo "::notice::external TestFlight state before beta-review check: $external_state; review=$review_state"

          if [[ "$review_state" == "REJECTED" ]]; then
            echo "::error::TestFlight beta review rejected ASC build $BUILD_ID"
            exit 1
          fi

          if [[ "$external_state" == "READY_FOR_BETA_SUBMISSION" && -z "$review_state" ]]; then
            submit_beta_review
          fi

          handle_terminal_state

          if [[ "$external_state" == "READY_FOR_BETA_SUBMISSION" ]]; then
            echo "::notice::ASC build $BUILD_ID is ready for beta submission but no review submission was visible yet; retry this workflow after App Store Connect settles"
            write_outputs false true ready-for-beta-submission
            exit 0
          fi

          echo "::error::unexpected external TestFlight state '$external_state' with review state '$review_state'"
          exit 1

      - name: Validate external TestFlight group
        id: testflight_groups
        if: steps.ver.outputs.channel == 'external' && steps.beta_review.outputs.external_ready == 'true'
        shell: bash
        env:
          PUBLIC_GROUP_ID: ${{ vars.ASC_TESTFLIGHT_PUBLIC_GROUP_ID }}
        run: |
          set -euo pipefail
          groups_json="$RUNNER_TEMP/testflight-groups.json"
          asc testflight groups list \
            --app "$ASC_APP_ID" \
            --output json > "$groups_json"

          public_group=""
          public_group_id=""

          if [[ -n "${PUBLIC_GROUP_ID:-}" ]]; then
            public_group="$(
              jq -c --arg id "$PUBLIC_GROUP_ID" '
                (.data // [])
                | map(select(.id == $id))
                | .[0] // empty
              ' "$groups_json"
            )"
            if [[ -z "$public_group" ]]; then
              echo "::warning::ASC_TESTFLIGHT_PUBLIC_GROUP_ID does not match any TestFlight group returned by ASC; attempting public-link auto-discovery"
            else
              public_kind="$(jq -r '.attributes.isInternalGroup // false' <<< "$public_group")"
              public_link="$(jq -r '.attributes.publicLinkEnabled // false' <<< "$public_group")"
              public_name="$(jq -r '.attributes.name // "<unnamed public group>"' <<< "$public_group")"
              if [[ "$public_kind" == "true" ]]; then
                echo "::warning::ASC_TESTFLIGHT_PUBLIC_GROUP_ID points at internal group '$public_name'; attempting public-link auto-discovery"
                public_group=""
              elif [[ "$public_link" != "true" ]]; then
                echo "::warning::ASC_TESTFLIGHT_PUBLIC_GROUP_ID points at '$public_name', which is not the public-link group; attempting public-link auto-discovery"
                public_group=""
              else
                public_group_id="$PUBLIC_GROUP_ID"
              fi
            fi
          else
            echo "::notice::ASC_TESTFLIGHT_PUBLIC_GROUP_ID not configured; attempting public-link auto-discovery"
          fi

          if [[ -z "$public_group" ]]; then
            public_candidates="$(
              jq -c '
                [(.data // [])[]
                | select((.attributes.isInternalGroup // false) == false)
                | select((.attributes.publicLinkEnabled // false) == true)]
              ' "$groups_json"
            )"
            public_count="$(jq -r 'length' <<< "$public_candidates")"
            if [[ "$public_count" == "1" ]]; then
              public_group="$(jq -c '.[0]' <<< "$public_candidates")"
              public_group_id="$(jq -r '.id' <<< "$public_group")"
              public_name="$(jq -r '.attributes.name // "<unnamed public group>"' <<< "$public_group")"
              echo "::warning::using auto-discovered public-link TestFlight group '$public_name'; update ASC_TESTFLIGHT_PUBLIC_GROUP_ID to $public_group_id"
            elif [[ "$public_count" == "0" ]]; then
              echo "::warning::no public-link TestFlight group was returned by ASC; build remains uploaded/processed, but CI will skip API group assignment"
            else
              echo "::warning::multiple public-link TestFlight groups were returned by ASC; build remains uploaded/processed, but CI will skip ambiguous API group assignment"
            fi
          fi

          if [[ -n "$public_group_id" ]]; then
            public_name="$(jq -r '.attributes.name // "<unnamed public group>"' <<< "$public_group")"
            echo "::notice::assigning the processed build to public TestFlight group '$public_name'"
          else
            echo "::notice::no public TestFlight group id resolved; skipping API group assignment"
          fi
          echo "external_group_ids=$public_group_id" >> "$GITHUB_OUTPUT"

      - name: Distribute to external TestFlight group
        if: steps.ver.outputs.channel == 'external' && steps.beta_review.outputs.external_ready == 'true'
        shell: bash
        env:
          BUILD_ID: ${{ steps.asc_build.outputs.build_id }}
          EXTERNAL_GROUP_IDS: ${{ steps.testflight_groups.outputs.external_group_ids }}
        run: |
          set -euo pipefail
          groups="$EXTERNAL_GROUP_IDS"
          if [[ -z "$groups" ]]; then
            echo "::notice::no external TestFlight groups resolved; treating uploaded/processed build as the release checkpoint"
            exit 0
          fi
          short_sha="${{ steps.ver.outputs.source_sha }}"
          short_sha="${short_sha:0:12}"
          notes="Tron ${{ steps.ver.outputs.display_version }} (${{ steps.ver.outputs.version }}), Apple build ${{ steps.ver.outputs.apple_build }}, commit $short_sha, GitHub run $GITHUB_RUN_NUMBER."
          asc publish testflight \
            --app "$ASC_APP_ID" \
            --build "$BUILD_ID" \
            --group "$groups" \
            --test-notes "$notes" \
            --locale en-US \
            --wait \
            --timeout 45m \
            --poll-interval 30s \
            --output json \
            --pretty

      - name: Upload App Store Connect diagnostics on failure
        if: failure() && steps.ver.outputs.dry_run != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-asc-diagnostics-${{ steps.ver.outputs.apple_build }}
          path: ${{ env.ASC_DIAGNOSTICS_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        shell: bash
        run: |
          {
            echo "## iOS TestFlight Release"
            echo ""
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Display: \`${{ steps.ver.outputs.display_version }}\`"
            echo "- Apple build: \`${{ steps.ver.outputs.apple_build }}\`"
            echo "- Bundle: \`$IOS_BUNDLE_ID\`"
            echo "- Channel: \`${{ steps.ver.outputs.channel }}\`"
            echo "- Source SHA: \`${{ steps.ver.outputs.source_sha }}\`"
            echo "- Dry run: \`${{ steps.ver.outputs.dry_run }}\`"
            if [[ "${{ steps.ver.outputs.dry_run }}" != "true" ]]; then
              echo "- ASC app: \`$ASC_APP_ID\`"
              echo "- Existing build reused: \`${{ steps.existing.outputs.exists || 'false' }}\`"
              if [[ "${{ steps.ver.outputs.channel }}" == "internal" ]]; then
                echo "- Internal TestFlight state: \`${{ steps.internal_availability.outputs.internal_state || 'unknown' }}\`"
                echo "- Distribution: available to the configured automatic internal group."
              else
                echo "- External TestFlight state: \`${{ steps.beta_review.outputs.external_state || 'unknown' }}\`"
                echo "- Beta review state: \`${{ steps.beta_review.outputs.review_state || 'unknown' }}\`"
                echo "- Beta review disposition: \`${{ steps.beta_review.outputs.disposition || 'not-run' }}\`"
                if [[ "${{ steps.beta_review.outputs.review_pending || 'false' }}" == "true" ]]; then
                  echo "- Distribution: pending Apple Beta App Review; rerun after approval to assign the public TestFlight group."
                elif [[ "${{ steps.beta_review.outputs.external_ready || 'false' }}" == "true" ]]; then
                  echo "- Distribution: public TestFlight group assignment attempted."
                fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down iOS release credentials
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          keychain_path="$RUNNER_TEMP/ios-signing.keychain-db"
          original_keychains_path="$RUNNER_TEMP/ios-original-keychains"
          original_default_path="$RUNNER_TEMP/ios-original-default-keychain"
          snapshot_ready="$RUNNER_TEMP/ios-keychain-snapshot-ready"
          installed_profile_uuids="$RUNNER_TEMP/ios-installed-profile-uuids"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

          # Restore persistent user preferences before deleting the keychain
          # they currently reference. The marker is written before mutation.
          if [[ -f "$snapshot_ready" ]]; then
            original_keychains=()
            while IFS= read -r original_keychain; do
              [[ -n "$original_keychain" ]] && original_keychains+=("$original_keychain")
            done < "$original_keychains_path"
            if (( ${#original_keychains[@]} == 0 )) || ! security list-keychains -d user -s "${original_keychains[@]}"; then
              echo "::error::failed to restore the user keychain search list"
              cleanup_failed=1
            fi
            original_default="$(<"$original_default_path")"
            if [[ -z "$original_default" ]] || ! security default-keychain -d user -s "$original_default"; then
              echo "::error::failed to restore the user default keychain"
              cleanup_failed=1
            fi
          fi

          if [[ -e "$keychain_path" ]]; then
            if ! security delete-keychain "$keychain_path"; then
              echo "::error::failed to delete the iOS signing keychain"
              cleanup_failed=1
              /bin/rm -f "$keychain_path"
            fi
          fi
          if [[ -e "$keychain_path" || -L "$keychain_path" ]]; then
            echo "::error::iOS signing keychain remains after cleanup"
            cleanup_failed=1
          fi

          # The UUID manifest contains only profiles this job created. An
          # identical pre-existing profile is reused and never recorded.
          if [[ -f "$installed_profile_uuids" ]]; then
            while IFS= read -r uuid; do
              [[ -n "$uuid" ]] || continue
              if [[ ! "$uuid" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
                echo "::error::refusing invalid provisioning profile UUID $uuid"
                cleanup_failed=1
                continue
              fi
              profile_path="$profiles_dir/$uuid.mobileprovision"
              if ! /bin/rm -f "$profile_path"; then
                echo "::error::failed to remove temporary provisioning profile $profile_path"
                cleanup_failed=1
              fi
            done < "$installed_profile_uuids"
          fi

          temporary_credentials=(
            "$RUNNER_TEMP/tron-asc-api-key.p8"
            "$RUNNER_TEMP/ios-distribution.p12"
            "$RUNNER_TEMP/app.mobileprovision"
            "$RUNNER_TEMP/share-extension.mobileprovision"
            "$RUNNER_TEMP/app-profile.plist"
            "$RUNNER_TEMP/share-extension-profile.plist"
            "$original_keychains_path"
            "$original_default_path"
            "$snapshot_ready"
            "$installed_profile_uuids"
          )
          for path in "${temporary_credentials[@]}"; do
            if ! /bin/rm -f "$path"; then
              echo "::error::failed to remove temporary credential file $path"
              cleanup_failed=1
            fi
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::temporary credential file remains at $path"
              cleanup_failed=1
            fi
          done
          exit "$cleanup_failed"
