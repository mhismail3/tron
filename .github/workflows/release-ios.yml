# Internal TestFlight beta delivery.
#
# A successful push CI run for the current main head archives the production
# iOS identity and uploads it to App Store Connect. The configured internal
# TestFlight group must have all-build access, so processed builds become
# available to its testers automatically. This workflow never submits an App
# Store release and has no external/public TestFlight path.
#
# Required secrets:
#   ASC_KEY_ID
#   ASC_ISSUER_ID
#   ASC_KEY_P8_BASE64
#   IOS_DISTRIBUTION_CERT_P12_BASE64
#   IOS_DISTRIBUTION_CERT_PASSWORD
#   IOS_APPSTORE_PROFILE_BASE64
#   IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64
#
# Required repository variable:
#   ASC_TESTFLIGHT_INTERNAL_GROUP_ID

name: Release (iOS TestFlight)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-testflight-main
  cancel-in-progress: false

jobs:
  eligibility:
    name: Confirm current main
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      source_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Reject stale CI completions
        id: check
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          eligible=false
          if [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]; then
            eligible=true
          else
            echo "::notice::Skipping stale CI source $SOURCE_SHA; current main is $(git rev-parse HEAD)"
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  testflight:
    name: Build and upload internal beta
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: macos-26
    environment: ios-testflight
    timeout-minutes: 75
    env:
      ASC_APP_ID: "6761511764"
      APPLE_TEAM_ID: MYGKXH6TY4
      IOS_APP_DIR: packages/ios-app
      IOS_SCHEME: Tron
      IOS_CONFIGURATION: Prod
      IOS_BUNDLE_ID: com.tron.mobile
      IOS_SHARE_EXTENSION_BUNDLE_ID: com.tron.mobile.ShareExtension
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligibility.outputs.source_sha }}
          fetch-depth: 1
          clean: true

      - name: Verify source is still current main
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git status --porcelain)" = ""
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || {
            echo "::error::TestFlight source is no longer the current main head"
            exit 1
          }

      - name: Select exact release Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.6"

      - name: Bind and verify release toolchain
        run: |
          set -euo pipefail
          source config/ci-toolchain.env
          echo "DEVELOPER_DIR=$TRON_RELEASE_IOS_DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$TRON_RELEASE_IOS_DEVELOPER_DIR" scripts/ios-release-toolchain-doctor.sh

      - name: Require TestFlight credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 }}
          INTERNAL_GROUP_ID: ${{ vars.ASC_TESTFLIGHT_INTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          required=(
            ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64
            IOS_DISTRIBUTION_CERT_P12_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD
            IOS_APPSTORE_PROFILE_BASE64 IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64
            INTERNAL_GROUP_ID
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          (( ${#missing[@]} == 0 )) || {
            echo "::error::missing TestFlight configuration: ${missing[*]}"
            exit 1
          }

      - name: Install pinned build tools
        run: scripts/install-ci-tools.sh xcodegen asc

      - name: Verify pinned build tools
        run: scripts/verify-ci-toolchain.sh xcodegen asc

      - name: Resolve version and build number
        id: version
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/tron version check
          source VERSION.env
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1
          (( GITHUB_RUN_NUMBER <= 899999 )) || {
            echo "::error::TestFlight workflow run number exceeds the build namespace"
            exit 1
          }
          (( GITHUB_RUN_ATTEMPT <= 99 )) || {
            echo "::error::TestFlight workflow attempt exceeds the build namespace"
            exit 1
          }
          marketing_version="${TRON_VERSION%%-*}"
          apple_build="$((1000 + GITHUB_RUN_NUMBER / 100)).$((GITHUB_RUN_NUMBER % 100)).$GITHUB_RUN_ATTEMPT"
          {
            echo "canonical=$TRON_VERSION"
            echo "marketing=$marketing_version"
            echo "apple_build=$apple_build"
            echo "short_sha=${SOURCE_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -d > "$key_path"
          test -s "$key_path"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_PRIVATE_KEY_PATH=$key_path"
            echo "ASC_BYPASS_KEYCHAIN=true"
            echo "ASC_STRICT_AUTH=true"
          } >> "$GITHUB_ENV"
          ASC_PRIVATE_KEY_PATH="$key_path" ASC_BYPASS_KEYCHAIN=true ASC_STRICT_AUTH=true asc auth status

      - name: Validate internal all-build group
        env:
          INTERNAL_GROUP_ID: ${{ vars.ASC_TESTFLIGHT_INTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/testflight-diagnostics"
          mkdir -p "$diagnostics"
          groups="$diagnostics/internal-groups.json"
          asc testflight groups list --app "$ASC_APP_ID" --internal --paginate --output json > "$groups"
          jq -e --arg id "$INTERNAL_GROUP_ID" '
            (.data // [])
            | any(.id == $id
                and (.attributes.isInternalGroup // false) == true
                and (.attributes.hasAccessToAllBuilds // false) == true)
          ' "$groups" >/dev/null || {
            echo "::error::ASC_TESTFLIGHT_INTERNAL_GROUP_ID must identify an internal all-build group"
            exit 1
          }

      - name: Refuse an already-used build number
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/testflight-diagnostics"
          result="$diagnostics/existing-build.json"
          asc builds list \
            --app "$ASC_APP_ID" \
            --version "${{ steps.version.outputs.marketing }}" \
            --build-number "${{ steps.version.outputs.apple_build }}" \
            --platform IOS \
            --limit 1 \
            --output json > "$result"
          count="$(jq -r '(.data // []) | if type == "array" then length elif type == "object" then 1 else 0 end' "$result")"
          (( count == 0 )) || {
            echo "::error::Apple build ${{ steps.version.outputs.apple_build }} already exists; rerun the workflow to allocate a fresh build number"
            exit 1
          }

      - name: Prepare signing certificate and profiles
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          source config/ci-toolchain.env
          keychain="$RUNNER_TEMP/tron-testflight.keychain-db"
          password="$(uuidgen)"
          original_keychains="$RUNNER_TEMP/original-keychains.txt"
          installed_profiles="$RUNNER_TEMP/installed-profiles.txt"
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          p12="$RUNNER_TEMP/distribution.p12"
          wwdr="$RUNNER_TEMP/AppleWWDRCAG3.cer"
          system_keychain="/Library/Keychains/System.keychain"
          system_root_keychain="/System/Library/Keychains/SystemRootCertificates.keychain"
          : > "$installed_profiles"
          mkdir -p "$profiles_dir"
          security list-keychains -d user | sed -E 's/^[[:space:]]+//; s/^"//; s/"$//' > "$original_keychains"
          search_list=()
          while IFS= read -r existing_keychain; do
            [[ -n "$existing_keychain" ]] && search_list+=("$existing_keychain")
          done < "$original_keychains"
          (( ${#search_list[@]} > 0 ))
          test -f "$system_keychain"
          test -f "$system_root_keychain"

          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -d > "$p12"
          test -s "$p12"
          curl -fsSL "$TRON_RELEASE_APPLE_WWDR_G3_URL" -o "$wwdr"
          test "$(shasum -a 256 "$wwdr" | awk '{print $1}')" = "$TRON_RELEASE_APPLE_WWDR_G3_SHA256"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$wwdr" -k "$keychain" >/dev/null
          security import "$p12" -k "$keychain" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s \
            "$keychain" "${search_list[@]}" "$system_keychain" "$system_root_keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk 'length($2) == 40 { print $2; exit }')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || {
            echo "::error::distribution certificate did not produce one signing identity"
            exit 1
          }

          install_profile() {
            local label="$1" bundle_id="$2" encoded="$3"
            local profile="$RUNNER_TEMP/$label.mobileprovision"
            local plist="$RUNNER_TEMP/$label-profile.plist"
            printf '%s' "$encoded" | base64 -d > "$profile"
            security cms -D -i "$profile" -o "$plist"
            local uuid application_id expiration expiration_epoch
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist" | tr '[:upper:]' '[:lower:]')"
            application_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
            expiration="$(plutil -extract ExpirationDate raw -o - "$plist")"
            [[ "$uuid" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]
            test "$application_id" = "$APPLE_TEAM_ID.$bundle_id"
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" >/dev/null 2>&1; then
              echo "::error::$label profile includes development devices"
              return 1
            fi
            test "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$plist" 2>/dev/null || true)" != true
            expiration_epoch="$(date -j -f '%Y-%m-%dT%H:%M:%SZ' "$expiration" '+%s')"
            (( expiration_epoch > $(date -u '+%s') ))
            destination="$profiles_dir/$uuid.mobileprovision"
            if [[ -e "$destination" ]]; then
              cmp -s "$profile" "$destination" || {
                echo "::error::$label profile UUID collides with different existing content"
                return 1
              }
            else
              cp "$profile" "$destination"
              echo "$destination" >> "$installed_profiles"
            fi
            printf '%s' "$uuid"
          }

          app_profile="$(install_profile app "$IOS_BUNDLE_ID" "$IOS_APPSTORE_PROFILE_BASE64")"
          share_profile="$(install_profile share "$IOS_SHARE_EXTENSION_BUNDLE_ID" "$IOS_SHARE_EXTENSION_APPSTORE_PROFILE_BASE64")"
          {
            echo "IOS_SIGNING_KEYCHAIN=$keychain"
            echo "IOS_SIGNING_IDENTITY=$identity"
            echo "IOS_APP_PROFILE=$app_profile"
            echo "IOS_SHARE_PROFILE=$share_profile"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_APP_DIR }}
        run: xcodegen generate

      - name: Archive production app
        working-directory: ${{ env.IOS_APP_DIR }}
        run: |
          set -euo pipefail
          archive="$(pwd)/build/TronMobile.xcarchive"
          rm -rf "$archive"
          xcodebuild archive \
            -project TronMobile.xcodeproj \
            -scheme "$IOS_SCHEME" \
            -configuration "$IOS_CONFIGURATION" \
            -archivePath "$archive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            "OTHER_CODE_SIGN_FLAGS=--keychain $IOS_SIGNING_KEYCHAIN" \
            "PROVISIONING_PROFILE_SPECIFIER=\$(TRON_APPSTORE_PROFILE_SPECIFIER)" \
            IOS_APP_PROFILE_SPECIFIER="$IOS_APP_PROFILE" \
            IOS_SHARE_PROFILE_SPECIFIER="$IOS_SHARE_PROFILE" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.apple_build }}" \
            -quiet
          echo "ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Verify archive identity
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/TronMobile.app"
          share="$app/PlugIns/TronShareExtension.appex"
          value() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist"; }
          test "$(value "$app" CFBundleIdentifier)" = "$IOS_BUNDLE_ID"
          test "$(value "$share" CFBundleIdentifier)" = "$IOS_SHARE_EXTENSION_BUNDLE_ID"
          for bundle in "$app" "$share"; do
            test "$(value "$bundle" CFBundleShortVersionString)" = "${{ steps.version.outputs.marketing }}"
            test "$(value "$bundle" CFBundleVersion)" = "${{ steps.version.outputs.apple_build }}"
            test "$(value "$bundle" ITSAppUsesNonExemptEncryption)" = false
          done
          test "$(value "$app" TRONCanonicalVersion)" = "${{ steps.version.outputs.canonical }}"
          codesign --verify --strict "$share"
          codesign --verify --deep --strict "$app"

      - name: Export App Store IPA
        working-directory: ${{ env.IOS_APP_DIR }}
        run: |
          set -euo pipefail
          export_dir="$(pwd)/build/export"
          options="$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$export_dir"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>app-store-connect</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_APP_PROFILE</string>
              <key>$IOS_SHARE_EXTENSION_BUNDLE_ID</key><string>$IOS_SHARE_PROFILE</string>
            </dict>
            <key>signingCertificate</key><string>$IOS_SIGNING_IDENTITY</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$options"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$options" \
            -quiet
          ipa="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$ipa"
          unzip -tq "$ipa"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Reconfirm current main before upload
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || {
            echo "::error::Main advanced while the beta was building; refusing to upload a stale build"
            exit 1
          }

      - name: Upload and wait for processing
        run: |
          set -euo pipefail
          notes="Tron ${{ steps.version.outputs.canonical }}, commit ${{ steps.version.outputs.short_sha }}, CI run ${{ github.event.workflow_run.id }}."
          asc builds upload \
            --app "$ASC_APP_ID" \
            --ipa "$IPA_PATH" \
            --version "${{ steps.version.outputs.marketing }}" \
            --build-number "${{ steps.version.outputs.apple_build }}" \
            --platform IOS \
            --checksum \
            --wait \
            --poll-interval 30s \
            --test-notes "$notes" \
            --locale en-US \
            --output json \
            --pretty

      - name: Resolve processed build
        id: build
        run: |
          set -euo pipefail
          build_id=""
          result="$RUNNER_TEMP/testflight-diagnostics/processed-build.json"
          for _ in {1..30}; do
            asc builds list \
              --app "$ASC_APP_ID" \
              --version "${{ steps.version.outputs.marketing }}" \
              --build-number "${{ steps.version.outputs.apple_build }}" \
              --platform IOS \
              --limit 10 \
              --output json > "$result"
            build_id="$(jq -r '(.data // []) | if type == "array" then .[0].id // empty else .id // empty end' "$result")"
            [[ -n "$build_id" ]] && break
            sleep 10
          done
          [[ -n "$build_id" ]] || { echo "::error::could not resolve the processed build"; exit 1; }
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Confirm internal TestFlight availability
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          set -euo pipefail
          detail="$RUNNER_TEMP/testflight-diagnostics/build-beta-detail.json"
          for _ in {1..90}; do
            asc builds build-beta-detail view --build-id "$BUILD_ID" --output json > "$detail"
            state="$(jq -r '.data.attributes.internalBuildState // .attributes.internalBuildState // empty' "$detail")"
            echo "::notice::internal TestFlight state=$state"
            case "$state" in
              READY_FOR_BETA_TESTING|IN_BETA_TESTING) exit 0 ;;
              PROCESSING_EXCEPTION|EXPIRED) echo "::error::internal TestFlight state is $state"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::build did not become available to internal TestFlight within 45 minutes"
          exit 1

      - name: Summary
        if: success()
        run: |
          {
            echo "## Internal TestFlight beta"
            echo ""
            echo "- Source: \`${{ needs.eligibility.outputs.source_sha }}\`"
            echo "- Version: \`${{ steps.version.outputs.canonical }}\`"
            echo "- Apple build: \`${{ steps.version.outputs.apple_build }}\`"
            echo "- App Store Connect build: \`${{ steps.build.outputs.build_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing credentials
        if: always()
        run: |
          set +e
          keychain="$RUNNER_TEMP/tron-testflight.keychain-db"
          original_keychains="$RUNNER_TEMP/original-keychains.txt"
          installed_profiles="$RUNNER_TEMP/installed-profiles.txt"
          if [[ -s "$original_keychains" ]]; then
            search_list=()
            while IFS= read -r existing_keychain; do
              [[ -n "$existing_keychain" ]] && search_list+=("$existing_keychain")
            done < "$original_keychains"
            (( ${#search_list[@]} == 0 )) || security list-keychains -d user -s "${search_list[@]}"
          fi
          [[ ! -e "$keychain" ]] || security delete-keychain "$keychain"
          if [[ -s "$installed_profiles" ]]; then
            while IFS= read -r profile; do rm -f "$profile"; done < "$installed_profiles"
          fi
          rm -f \
            "$RUNNER_TEMP"/AuthKey_*.p8 \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            "$RUNNER_TEMP"/*-profile.plist \
            "$RUNNER_TEMP"/*.mobileprovision \
            "$original_keychains" \
            "$installed_profiles"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-diagnostics
          if-no-files-found: ignore
          retention-days: 14
