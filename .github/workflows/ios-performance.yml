# Advisory A/B evidence for iOS test parallelism. Promotion into CI requires
# matching enumeration hashes/counts and a sustained p95 improvement.

name: iOS performance experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read

jobs:
  test-strategy:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Serial baseline
            workers: 1
          - name: Two-worker candidate
            workers: 2
    defaults:
      run:
        working-directory: packages/ios-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"
      - name: Install checksum-pinned tools
        run: ../../scripts/install-ci-tools.sh xcodegen
      - name: Verify pinned toolchain
        run: ../../scripts/verify-ci-toolchain.sh ios xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run measured strategy
        env:
          TRON_IOS_CI_ENUMERATE_TESTS: "true"
          TRON_IOS_CI_PARALLEL_WORKERS: ${{ matrix.workers }}
        run: ../../scripts/ios-ci-test.sh
      - name: Upload strategy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-performance-workers-${{ matrix.workers }}
          path: |
            packages/ios-app/build/ios-ci-metrics.json
            packages/ios-app/build/ios-test-enumeration.json
          if-no-files-found: error
          retention-days: 90
