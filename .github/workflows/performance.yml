# Advisory server-performance evidence. Shared-host variance makes this
# scheduled job informational until a stable runner and baseline are promoted.
name: Performance

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Advisory benchmark
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: packages/agent
          rustflags: "-D warnings"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.4"

      - name: Benchmark schema self-test
        run: python3 scripts/benchmarks/bench.py --self-test

      - name: Build release server
        working-directory: packages/agent
        run: cargo build --release --bin tron --locked

      - name: Capture benchmark report
        run: |
          mkdir -p artifacts/benchmarks
          uv run --isolated --no-project --with websockets==15.0.1 \
            python3 scripts/benchmarks/bench.py \
            --scenario gate \
            --iterations 100 \
            --output artifacts/benchmarks/scheduled.json

      - name: Publish advisory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scheduled-performance-${{ github.run_id }}
          path: artifacts/benchmarks/scheduled.json
          retention-days: 30
