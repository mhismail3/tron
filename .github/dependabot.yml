version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/gateway
    schedule:
      interval: weekly
    labels: ["kind:maintenance", "area:gateway"]
    ignore:
      # The Node types follow the runtime's major (.node-version); a Node major
      # moves through its own runbook (#245), not a types-only bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      pi-sdk:
        patterns:
          - "@earendil-works/pi-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["kind:maintenance", "area:tooling"]
