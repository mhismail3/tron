platform = "darwin"

[[actions]]
name = "Rebuild + Install + Launch iOS Prod Release on iPad"
icon = "debug"
command = "env TRON_IOS_DEVICE_NAME=iPad TRON_IOS_SCHEME=Tron TRON_IOS_CONFIGURATION=Prod scripts/tron-ios-device install"
platform = "darwin"

[[actions]]
