version = 1
name = "Tron local"

[setup]
script = ""

[[actions]]
name = "Dev Server"
icon = "run"
command = "scripts/tron dev -bdt"
platform = "darwin"

[[actions]]
name = "Stop Dev Server"
icon = "tool"
command = "scripts/tron dev --stop"
platform = "darwin"

[[actions]]
name = "Rebuild + Install + Launch iOS Beta Simulator"
icon = "debug"
