name = "tron-push-relay"
main = "src/index.ts"
compatibility_date = "2026-07-24"

[[durable_objects.bindings]]
name = "PUSH_REGISTRY"
class_name = "PushRegistry"

# Production is a fresh service. The retired RelayLedger namespace is not part
# of this migration history and must never be recreated.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushRegistry"]

# Isolated physical-device validation target. Named-environment bindings and
# migrations are intentionally independent from the historical production
# service, so `--env sandbox` can never rename or write its Durable Object.
[env.sandbox]
name = "tron-push-relay-sandbox"
workers_dev = true

[[env.sandbox.durable_objects.bindings]]
name = "PUSH_REGISTRY"
class_name = "PushRegistry"

[[env.sandbox.migrations]]
tag = "v1"
new_sqlite_classes = ["PushRegistry"]

# Secrets are configured manually and independently on each service:
# - APNS_KEY_P8
# - APNS_KEY_ID
# - APNS_TEAM_ID
# - APPLE_TEAM_ID
