name: TronMac
options:
  bundleIdPrefix: com.tron
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  generateEmptyDirectories: false
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: MYGKXH6TY4
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  TronMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        createIntermediateGroups: true
        excludes:
          - "Resources/**"
      # Ordinary resources are copied through Xcode's resource phase. The
      # tracked Library tree is excluded because the post-build script owns
      # its `Contents/Library` placement and nested signing order.
      - path: Sources/Resources
        createIntermediateGroups: true
        buildPhase: resources
        optional: true
        excludes:
          - "Library/**"
          - "Gateway/**"
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TronMac.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        TRON_CANONICAL_VERSION: "0.1.0-beta.7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac
    preBuildScripts:
      - name: Ensure Bundled Gateway Payload
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [[ "${CONFIGURATION:-}" == "Release" ]]; then
            "$SRCROOT/../../scripts/validate-push-service-config.sh" "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          else
            "$SRCROOT/../../scripts/validate-push-service-config.sh" --allow-empty "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          fi
          "$SRCROOT/scripts/ensure-gateway-bundle.sh"
    postBuildScripts:
      - name: Copy Bundled Login Item
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/Sources/Resources/Library"
          DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library"
          GATEWAY_SRC="$SRCROOT/Sources/Resources/Gateway"
          GATEWAY_DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/Gateway"
          test -d "$SRC" || { echo "Missing bundled Library resources at $SRC" >&2; exit 1; }
          test -d "$GATEWAY_SRC" || { echo "Missing bundled Gateway resources at $GATEWAY_SRC; run scripts/bundle-gateway.sh" >&2; exit 1; }
          # A previous build may contain the deliberately read-only payload.
          # Make only that generated destination removable before replacing it.
          chmod -R u+w "$GATEWAY_DST" 2>/dev/null || true
          rm -rf "$DST" "$GATEWAY_DST"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources"
          ditto "$SRC" "$DST"
          # ditto/cp can fail while materializing symlinks inside a 0555 source
          # tree because they apply directory modes before populating children.
          # rsync defers final directory modes and preserves the internal links.
          /usr/bin/rsync -a "$GATEWAY_SRC/" "$GATEWAY_DST/"
          # Signing rewrites Mach-O files, so the copied payload must be
          # writable until signatures and its final fingerprint are complete.
          chmod -R u+w "$GATEWAY_DST"
          if [ -d "$DST/LoginItems" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
            NODE_ENTITLEMENTS="$SRCROOT/TronNode.entitlements"
            test -f "$NODE_ENTITLEMENTS" || { echo "Missing Node runtime entitlements at $NODE_ENTITLEMENTS" >&2; exit 1; }
            find "$GATEWAY_DST" -type f \( -perm -111 -o -name '*.node' \) | while IFS= read -r NATIVE; do
              if file "$NATIVE" | grep -q 'Mach-O'; then
                if [ "$NATIVE" = "$GATEWAY_DST/runtime/node-arm64" ] \
                  || [ "$NATIVE" = "$GATEWAY_DST/runtime/node-x64" ]; then
                  codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none \
                    --entitlements "$NODE_ENTITLEMENTS" "$NATIVE"
                else
                  codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$NATIVE"
                fi
              fi
            done
            for HELPER in "$DST"/LoginItems/*.app; do
              [ -d "$HELPER" ] || continue
              codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$HELPER"
            done
            # Native signing changes payload bytes. Recompute the selected
            # bundle fingerprint before the outer app seals its resources.
            PAYLOAD_HASHER="$DST/LoginItems/Tron Agent.app/Contents/MacOS/tron"
            PAYLOAD_FINGERPRINT="$("$PAYLOAD_HASHER" --fingerprint "$GATEWAY_DST")"
            "$SRCROOT/scripts/update-payload-fingerprint.sh" "$GATEWAY_DST/manifest.json" "$PAYLOAD_FINGERPRINT"
            chmod -R a-w "$GATEWAY_DST"
            if [ -n "${CODESIGNING_FOLDER_PATH:-}" ] \
              && [ -d "$CODESIGNING_FOLDER_PATH" ] \
              && [ ! -d "$CODESIGNING_FOLDER_PATH/Contents/PlugIns" ]; then
              ENTITLEMENTS_PATH=""
              if [ -f "$TARGET_TEMP_DIR/$PRODUCT_NAME.app.xcent" ]; then
                ENTITLEMENTS_PATH="$TARGET_TEMP_DIR/$PRODUCT_NAME.app.xcent"
              elif [ -n "${CODE_SIGN_ENTITLEMENTS:-}" ] && [ -f "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" ]; then
                ENTITLEMENTS_PATH="$SRCROOT/$CODE_SIGN_ENTITLEMENTS"
              fi
              if [ -n "$ENTITLEMENTS_PATH" ]; then
                codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none --entitlements "$ENTITLEMENTS_PATH" "$CODESIGNING_FOLDER_PATH"
              else
                codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$CODESIGNING_FOLDER_PATH"
              fi
            fi
          else
            chmod -R a-w "$GATEWAY_DST"
          fi

  TronMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        createIntermediateGroups: true
        optional: true
    dependencies:
      - target: TronMac
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TronMac.app/Contents/MacOS/TronMac"
        GENERATE_INFOPLIST_FILE: YES
        TEST_RUNNER_WAIT_FOR_DEBUGGER: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac.tests

schemes:
  TronMac:
    build:
      targets:
        TronMac: all
        TronMacTests: [test]
    run:
      config: Debug
      environmentVariables:
        TRON_PROJECT_ROOT: "$(SRCROOT)/../.."
    test:
      config: Debug
      environmentVariables:
        TRON_MAC_TEST_HOST: "1"
      targets:
        - TronMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
