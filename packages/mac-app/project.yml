name: TronMac
options:
  bundleIdPrefix: com.tron
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  generateEmptyDirectories: false
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: MYGKXH6TY4
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    TRON_GATEWAY_PROTOCOL_VERSION: "5"
    TRON_GATEWAY_MIN_PROTOCOL_VERSION: "5"

packages:
  TronComputerControl:
    path: native-computer-control

targets:
  TronSearchEmbeddingHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Search
    settings:
      base:
        PRODUCT_NAME: TronSearchEmbeddingHelper
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  TronMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        createIntermediateGroups: true
        excludes:
          - "Resources/**"
          - "NativeHost/**"
          - "Search/**"
      # Ordinary resources are copied through Xcode's resource phase. The
      # tracked Library tree is excluded because the post-build script owns
      # its `Contents/Library` placement and nested signing order.
      - path: Sources/Resources
        createIntermediateGroups: true
        buildPhase: resources
        optional: true
        excludes:
          - "Library/**"
          - "Gateway/**"
    dependencies:
      - target: TronSearchEmbeddingHelper
        embed: false
        link: false
      - target: TronNativeHost
        embed: false
        link: false
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TronMac.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        TRON_CANONICAL_VERSION: "0.1.0-beta.7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac
    preBuildScripts:
      - name: Ensure Bundled Gateway Payload
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          python3 "$SRCROOT/../../scripts/verify-gateway-protocol-contract.py" >/dev/null
          if [[ "${CONFIGURATION:-}" == "Release" ]]; then
            "$SRCROOT/../../scripts/validate-push-service-config.sh" "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          else
            "$SRCROOT/../../scripts/validate-push-service-config.sh" --allow-empty "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          fi
          "$SRCROOT/scripts/ensure-gateway-bundle.sh"
      - name: Build Native Capture Client
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/native-gateway-client/prepare.sh"
          "$SRCROOT/scripts/ensure-cua-driver.sh" "$DERIVED_FILE_DIR/tron-cua"
    postBuildScripts:
      - name: Copy Bundled Login Item
        basedOnDependencyAnalysis: false
        # The protocol verifier reads the processed artifact plist. Declare the
        # producer dependency so clean builds cannot schedule this script before
        # ProcessInfoPlistFile.
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -euo pipefail
          SRC="$SRCROOT/Sources/Resources/Library"
          DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library"
          NATIVE_SRC="$BUILT_PRODUCTS_DIR/TronNativeHost.app"
          NATIVE_DST="$DST/Native/Tron Native Host.app"
          GATEWAY_SRC="$SRCROOT/Sources/Resources/Gateway"
          GATEWAY_DST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/Gateway"
          test -d "$SRC" || { echo "Missing bundled Library resources at $SRC" >&2; exit 1; }
          test -d "$NATIVE_SRC" || { echo "Missing built Tron Native Host at $NATIVE_SRC" >&2; exit 1; }
          test -d "$GATEWAY_SRC" || { echo "Missing bundled Gateway resources at $GATEWAY_SRC; run scripts/bundle-gateway.sh" >&2; exit 1; }
          # A previous build may contain the deliberately read-only payload.
          # Make only that generated destination removable before replacing it.
          chmod -R u+w "$GATEWAY_DST" 2>/dev/null || true
          # Retire the obsolete auto-embedded helper in incremental build output;
          # only the explicit Library/Native copy below belongs in the app.
          rm -rf "$DST" "$GATEWAY_DST" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/TronNativeHost.app"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources" "$DST/Native"
          EMBEDDING_HELPER="$BUILT_PRODUCTS_DIR/TronSearchEmbeddingHelper"
          test -x "$EMBEDDING_HELPER" || { echo "Missing signed NaturalLanguage embedding helper at $EMBEDDING_HELPER" >&2; exit 1; }
          install -m 0755 "$EMBEDDING_HELPER" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/TronSearchEmbeddingHelper"
          ditto "$SRC" "$DST"
          ditto "$NATIVE_SRC" "$NATIVE_DST"
          install -m 0644 "$DERIVED_FILE_DIR/tron-native-capture.node" "$DST/Native/tron-native-capture.node"
          install -m 0644 "$DERIVED_FILE_DIR/tron-native-capture.inputs.json" "$DST/Native/tron-native-capture.inputs.json"
          install -m 0755 "$DERIVED_FILE_DIR/tron-cua/cua-driver" "$DST/Native/cua-driver"
          install -m 0644 "$DERIVED_FILE_DIR/tron-cua/manifest.json" "$DST/Native/cua-driver.manifest.json"
          install -m 0644 "$DERIVED_FILE_DIR/tron-cua/LICENSE.txt" "$DST/Native/cua-driver-LICENSE.txt"
          # ditto/cp can fail while materializing symlinks inside a 0555 source
          # tree because they apply directory modes before populating children.
          # rsync defers final directory modes and preserves the internal links.
          /usr/bin/rsync -a "$GATEWAY_SRC/" "$GATEWAY_DST/"
          python3 "$SRCROOT/../../scripts/verify-gateway-protocol-contract.py" \
            --mac-app "$TARGET_BUILD_DIR/$WRAPPER_NAME" >/dev/null
          # Signing rewrites Mach-O files, so the copied payload must be
          # writable until signatures and its final fingerprint are complete.
          chmod -R u+w "$GATEWAY_DST"
          if [ -d "$DST/LoginItems" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
            NODE_ENTITLEMENTS="$SRCROOT/TronNode.entitlements"
            test -f "$NODE_ENTITLEMENTS" || { echo "Missing Node runtime entitlements at $NODE_ENTITLEMENTS" >&2; exit 1; }
            find "$GATEWAY_DST" -type f \( -perm -111 -o -name '*.node' \) | while IFS= read -r NATIVE; do
              if file "$NATIVE" | grep -q 'Mach-O'; then
                if [ "$NATIVE" = "$GATEWAY_DST/runtime/node-arm64" ] \
                  || [ "$NATIVE" = "$GATEWAY_DST/runtime/node-x64" ]; then
                  codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none \
                    --entitlements "$NODE_ENTITLEMENTS" "$NATIVE"
                else
                  codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$NATIVE"
                fi
              fi
            done
            for HELPER in "$DST"/LoginItems/*.app; do
              [ -d "$HELPER" ] || continue
              codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$HELPER"
            done
            # Cua remains byte-identical to its verified vendor-signed release.
            # It executes as a child; it is not loaded into Tron's process.
            # Sign the Aqua TCC host after copying it into its final nested
            # location, then the outer app seals both native compositions.
            codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$NATIVE_DST"
            codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/TronSearchEmbeddingHelper"
            codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$DST/Native/tron-native-capture.node"
            # Native signing changes payload bytes. Recompute the selected
            # bundle fingerprint before the outer app seals its resources.
            PAYLOAD_HASHER="$DST/LoginItems/Tron Agent.app/Contents/MacOS/tron"
            PAYLOAD_FINGERPRINT="$("$PAYLOAD_HASHER" --fingerprint "$GATEWAY_DST")"
            "$SRCROOT/scripts/update-payload-fingerprint.sh" "$GATEWAY_DST/manifest.json" "$PAYLOAD_FINGERPRINT"
            chmod -R a-w "$GATEWAY_DST"
            if [ -n "${CODESIGNING_FOLDER_PATH:-}" ] \
              && [ -d "$CODESIGNING_FOLDER_PATH" ] \
              && [ ! -d "$CODESIGNING_FOLDER_PATH/Contents/PlugIns" ]; then
              ENTITLEMENTS_PATH=""
              if [ -f "$TARGET_TEMP_DIR/$PRODUCT_NAME.app.xcent" ]; then
                ENTITLEMENTS_PATH="$TARGET_TEMP_DIR/$PRODUCT_NAME.app.xcent"
              elif [ -n "${CODE_SIGN_ENTITLEMENTS:-}" ] && [ -f "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" ]; then
                ENTITLEMENTS_PATH="$SRCROOT/$CODE_SIGN_ENTITLEMENTS"
              fi
              if [ -n "$ENTITLEMENTS_PATH" ]; then
                codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none --entitlements "$ENTITLEMENTS_PATH" "$CODESIGNING_FOLDER_PATH"
              else
                codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none "$CODESIGNING_FOLDER_PATH"
              fi
            fi
          else
            chmod -R a-w "$GATEWAY_DST"
          fi

  TronNativeHost:
    type: application
    platform: macOS
    sources:
      - path: Sources/NativeHost/main.swift
      - path: Sources/NativeHost/CuaProcessOwner.swift
      - path: Sources/Support/Onboarding/NativeHostProtocol.swift
    dependencies:
      - target: TronNativeCaptureHost
      - package: TronComputerControl
        product: TronComputerControl
    settings:
      base:
        INFOPLIST_FILE: Sources/NativeHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac.native-host
        TRON_CUA_DRIVER_SHA256: ${TRON_CUA_DRIVER_SHA256}
        PRODUCT_NAME: TronNativeHost
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "7"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  TronNativeCaptureHost:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/NativeHost
        createIntermediateGroups: true
        excludes:
          - main.swift
          - CuaProcessOwner.swift
          - Info.plist
      - path: Sources/Support/Onboarding/NativeCodeSigning.swift
      - path: Sources/Server/Paths/TronGatewayProfile.swift
      - path: Sources/Server/Paths/GatewayPayloadStore.swift
      - path: Sources/Server/Health/GatewayProtocolContract.swift
      - path: Sources/Server/Health/StableGatewayProvenance.swift
      - path: Sources/Server/LaunchAgent/LaunchAgentRuntimeReader.swift
      - path: Sources/Server/ProcessControl/ServerProcessProbe.swift
      - path: Sources/Support/Foundation/Subprocess.swift
    dependencies:
      - package: TronComputerControl
        product: TronComputerControl
    settings:
      base:
        PRODUCT_NAME: TronNativeCaptureHost
        PRODUCT_MODULE_NAME: TronNativeCaptureHost
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/Onboarding/NativeCaptureService.h

  SingleInstanceLockProbe:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Server/ProcessControl/SingleInstanceLock.swift
      - path: Tests/Fixtures/SingleInstanceLockProbe
        createIntermediateGroups: true

  TronMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/NativeHost/CuaProcessOwner.swift
      - path: Tests
        createIntermediateGroups: true
        optional: true
        excludes:
          - Fixtures/SingleInstanceLockProbe/**
    dependencies:
      - target: TronMac
      - target: SingleInstanceLockProbe
      - target: TronNativeCaptureHost
      - package: TronComputerControl
        product: TronComputerControl
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TronMac.app/Contents/MacOS/TronMac"
        GENERATE_INFOPLIST_FILE: YES
        TEST_RUNNER_WAIT_FOR_DEBUGGER: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mac.tests

schemes:
  TronMac:
    build:
      targets:
        TronMac: all
        TronMacTests: [test]
    run:
      config: Debug
      environmentVariables:
        TRON_PROJECT_ROOT: "$(SRCROOT)/../.."
    test:
      config: Debug
      environmentVariables:
        TRON_MAC_TEST_HOST: "1"
        TRON_SINGLE_INSTANCE_LOCK_PROBE: "$(BUILT_PRODUCTS_DIR)/SingleInstanceLockProbe"
      targets:
        - TronMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
