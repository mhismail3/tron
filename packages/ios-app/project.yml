name: TronMobile
options:
  bundleIdPrefix: com.tron
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "2660"
  developmentLanguage: en
  generateEmptyDirectories: false
  createIntermediateGroups: true
  # XcodeGen materializes empty action nodes for omitted scheme actions. Strip
  # those nodes after generation so unsafe actions do not exist in Xcode.
  postGenCommand: |
    python3 - <<'PY'
    from pathlib import Path
    import xml.etree.ElementTree as ET

    scheme_dir = Path("TronMobile.xcodeproj/xcshareddata/xcschemes")
    expected = {
        "Tron Development",
        "Tron Device",
        "Tron UI Validation",
        "Tron Device Performance",
        "Tron Release",
    }
    paths = {path.stem: path for path in scheme_dir.glob("*.xcscheme")}
    if set(paths) != expected:
        raise SystemExit(f"unexpected generated schemes: {sorted(paths)}")
    for name, path in paths.items():
        tree = ET.parse(path)
        root = tree.getroot()
        removed = ("TestAction", "LaunchAction") if name == "Tron Release" else (
            "ProfileAction", "AnalyzeAction", "ArchiveAction"
        )
        for tag in removed:
            node = root.find(tag)
            if node is None:
                raise SystemExit(f"{name} is missing generated {tag}")
            root.remove(node)
        ET.indent(tree, space="   ")
        tree.write(path, encoding="UTF-8", xml_declaration=True)
    PY

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.16.0

configFiles:
  Development: Configuration/Development.xcconfig
  Test: Configuration/Test.xcconfig
  LocalDevice: Configuration/LocalDevice.xcconfig
  DevicePerformance: Configuration/DevicePerformance.xcconfig
  Release: Configuration/Release.xcconfig

configs:
  Development: debug
  Test: debug
  LocalDevice: debug
  DevicePerformance: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"
    TRON_CANONICAL_VERSION: "0.1.0-beta.7"
    TRON_GATEWAY_PROTOCOL_VERSION: "4"
    TRON_GATEWAY_MIN_PROTOCOL_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: MYGKXH6TY4
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  TronMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
        createIntermediateGroups: true
      - path: Sources/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Sources/Resources/ThirdPartyNotices
        type: folder
        buildPhase: resources
      - path: Sources/Resources/Sounds/tron-notification.caf
        buildPhase: resources
    preBuildScripts:
      - name: Validate product push configuration
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          python3 "$SRCROOT/../../scripts/verify-gateway-protocol-contract.py" >/dev/null
          if [[ "${ACTION:-}" == "install" || "${CONFIGURATION:-}" == "Release" ]]; then
            "$SRCROOT/../../scripts/validate-push-service-config.sh" "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          else
            "$SRCROOT/../../scripts/validate-push-service-config.sh" --allow-empty "$SRCROOT/../../config/PushService.xcconfig" >/dev/null
          fi
    dependencies:
      - target: TronShareExtension
        embed:
          codeSign: true
          removeHeadersOnCopy: true
      - package: SwiftTerm
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/PrivateVariableBlurBridge.h
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_APP_PROFILE_SPECIFIER)"
      configs:
        Development:
          CODE_SIGN_ENTITLEMENTS: TronMobileDevelopment.entitlements
        LocalDevice:
          CODE_SIGN_ENTITLEMENTS: TronMobileLocalDevice.entitlements
        DevicePerformance:
          CODE_SIGN_ENTITLEMENTS: TronMobileLocalDevice.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TronMobileRelease.entitlements
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.testhost
          CODE_SIGN_ENTITLEMENTS: ""

  TronShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sources/Support/SharedContent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtensionProduction.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_SHARE_PROFILE_SPECIFIER)"
      configs:
        Development:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.beta.ShareExtension
          CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtensionDevelopment.entitlements
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.testhost.ShareExtension
          CODE_SIGN_ENTITLEMENTS: ""

  TronMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        createIntermediateGroups: true
        optional: true
      - path: ../protocol-fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TronMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.testhost.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TronMobile.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TronMobile"
        GENERATE_INFOPLIST_FILE: YES
        TEST_RUNNER_WAIT_FOR_DEBUGGER: NO

  TronMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        createIntermediateGroups: true
        optional: true
      - path: docs/assets/parity
        buildPhase: resources
        createIntermediateGroups: true
    dependencies:
      - target: TronMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tron.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TronMobile

schemes:
  Tron Development:
    build:
      targets:
        TronMobile: all
        TronShareExtension: all
        TronMobileTests: [test]
    run:
      config: Development
    test:
      config: Test
      testPlans:
        - path: TestPlans/UnitTests.xctestplan
          defaultPlan: true

  Tron Device:
    build:
      targets:
        TronMobile: all
        TronShareExtension: all
        TronMobileTests: [test]
    run:
      config: LocalDevice
    test:
      config: Test
      testPlans:
        - path: TestPlans/UnitTests.xctestplan
          defaultPlan: true

  Tron UI Validation:
    build:
      targets:
        TronMobile: all
        TronShareExtension: all
        TronMobileUITests: [test]
    run:
      config: Development
    test:
      config: Development
      environmentVariables:
        TRON_E2E_PORT: "$(TRON_E2E_PORT_VALUE)"
        TRON_E2E_CODE: "$(TRON_E2E_CODE_VALUE)"
        TRON_E2E_WORKSPACE: "$(TRON_E2E_WORKSPACE_VALUE)"
      testPlans:
        - path: TestPlans/UIValidation.xctestplan
          defaultPlan: true

  Tron Device Performance:
    build:
      targets:
        TronMobile: all
        TronShareExtension: all
        TronMobileTests: [test]
    run:
      config: DevicePerformance
    test:
      config: DevicePerformance
      environmentVariables:
        TRON_PERFORMANCE_BASELINE: "$(TRON_PERFORMANCE_BASELINE_VALUE)"
      testPlans:
        - path: TestPlans/UnitTests.xctestplan
          defaultPlan: true

  Tron Release:
    build:
      targets:
        TronMobile: all
        TronShareExtension: all
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
