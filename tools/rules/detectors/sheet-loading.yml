id: sheet-loading
language: Swift
rule:
  any:
    - pattern: ProgressView($$$ARGS)
    - pattern: Text("$CONTENT")
    - pattern: TronSheetLoadingHostModifier
tests:
  - id: shared-sheet-loading-pulse
    invalid:
      - |
        ProgressView()
      - |
        ProgressView("Completing setup…")
    valid:
      - |
        TronSheetLoadingState(label: "Loading…")
      - |
        ProgressView(value: 3, total: 10)
      - |
        // ProgressView()
        let text = "ProgressView()"
